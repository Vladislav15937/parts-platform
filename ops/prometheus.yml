# Сбор метрик ячейки.
#
# Хранилище здесь же, в ячейке, и это осознанно: внешний сервис наблюдения —
# ещё один договор и ещё одна зависимость, а первым клиентам нужен ответ
# на один вопрос — «встал ли релей». Понадобится долгая история и графики
# по всем ячейкам — сюда встанет remote_write, и это не потребует менять
# ни приложение, ни правила.

global:
  # Метрики очереди пересчитываются раз в тридцать секунд (EventQueueMetrics),
  # опрашивать чаще нечего: одно и то же число приедет дважды.
  scrape_interval: 30s
  evaluation_interval: 30s

  # Имя ячейки уезжает в тревогу. Когда ячеек две, «Релей встал» без имени
  # не говорит, куда идти. Подставляется при запуске — см. compose.
  external_labels:
    cell: ЯЧЕЙКА_ПОДСТАВЛЯЕТСЯ

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Приложение. Адрес открыт без учётной записи: у сборщика её нет и быть
  # не может, а наружу порт приложения не выставлен вовсе — дойти сюда
  # можно только изнутри сети docker.
  #
  # Сборок две — синяя и зелёная, — и опрашиваются ОБЕ, а не «та, что под
  # трафиком». Так честнее: во время выкладки работают обе, очередь событий
  # у них общая, и «какая именно сборка молчит» — это то, что надо видеть
  # ровно в минуту переключения. Имени активной сборки сборщик не знает
  # вовсе, то есть второго места, где оно записано, не появилось.
  #
  # Цели ищутся в DNS сети compose, а не перечислены статически, и это
  # не украшение: у погашенной сборки имя не разрешается, значит цель просто
  # исчезает. Перечисли мы её статически — `up` навсегда осталось бы нулём
  # у той сборки, которой сейчас нет, и любое правило по `up` кричало бы
  # об исправной ячейке. Тревога «не отвечает» поэтому написана
  # как `absent(up == 1)`: она про «ни одна сборка не отвечает», а не
  # про «какая-то не отвечает» (ops/alerts.yml).
  - job_name: partsflow
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [app-blue, app-green]
        type: A
        port: 8080
        # Чаще незачем: метрики очереди и так пересчитываются раз
        # в тридцать секунд.
        refresh_interval: 30s
    relabel_configs:
      # Метка сборки — из имени, по которому её нашли. Без неё две сборки
      # различались бы только адресом контейнера, а он меняется при каждом
      # пересоздании.
      - source_labels: [__meta_dns_name]
        target_label: build
        regex: 'app-(.*)'
        replacement: '${1}'
      # И instance — тоже имя, а не адрес: иначе каждая выкладка заводит
      # новый временной ряд, и график обрывается на ровном месте.
      - source_labels: [__meta_dns_name]
        target_label: instance

  # Сам диспетчер тревог. До 20 сентября 2026 его не опрашивал никто, и это
  # была дыра ровно в том месте, где стоит адресат: 19 сентября доставка
  # оборвалась, диспетчер записал 2731 отказ В СВОЙ ЛОГ — и всё. Отказ
  # доставки не был виден ни одним числом, то есть спросить «уходят ли
  # тревоги» было негде.
  #
  # Тревоги на эти ряды тут НЕТ намеренно: сообщать о немом канале его же
  # средствами бессмысленно. Будит второй путь — ops/alert-channel-check.sh,
  # он ходит мимо диспетчера и стеком хоста. А ряды нужны, чтобы у вопроса
  # «когда канал последний раз доставлял» был ответ числом, а не пересказом
  # лога.
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  # Бэкап — разовая задача по расписанию, опрашивать её некому: между
  # запусками процесса нет. Поэтому он сам кладёт отметку об успехе сюда,
  # а Prometheus читает её отсюда.
  - job_name: backup
    # Иначе метрика получит job="pushgateway" вместо того, с которым её
    # положили, и правило «бэкап не снимался сутки» перестанет её видеть.
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
