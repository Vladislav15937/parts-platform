# Тревоги ячейки.
#
# Правило одно на все: тревога должна означать «иди и сделай». Всё, на что
# ответ «ну и ладно», сюда не попадает — иначе через месяц уведомления
# перестают читать, и настоящая авария приходит в общей куче.

groups:
  - name: partsflow
    rules:
      # Ячейка не отвечает. Две минуты — это перезапуск при выкладке,
      # больше — уже нет.
      - alert: ЯчейкаНеОтвечает
        expr: up{job="partsflow"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] приложение не отвечает сборщику метрик'
          description: >-
            Метрики не снимаются {{ $value }} — приложение либо упало,
            либо не поднялось после выкладки. Клиенты в это время
            не могут ни принять деталь, ни продать.

      # Тревога на возраст, а не на глубину. Сто событий, появившихся секунду
      # назад, — обычная работа; те же сто возрастом в пять минут — вставший
      # релей, и дельты на площадку уже не уходят.
      - alert: РелейВстал
        expr: partsflow_outbox_oldest_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] событие ждёт отправки больше пяти минут'
          description: >-
            Самое старое неотправленное событие возрастом {{ $value | humanizeDuration }}.
            Релей не разбирает outbox: остаток на площадке разъезжается
            с настоящим, и покупатель приедет за проданной деталью.

      # Пока робот повторяет — делать нечего. Запись, которую он бросил,
      # ждёт человека и сама не рассосётся.
      - alert: НедоставленноеЖдётЧеловека
        expr: partsflow_deadletter_attention > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] {{ $value }} событий брошено роботом'
          description: >-
            Робот исчерпал пять попыток. Разбирается на экране «Доставка»:
            повторить по кнопке или снять без отправки.

      # Бэкап, который тихо перестал сниматься, обнаруживается в день, когда
      # он понадобился. Отметку об успехе кладёт сам ops/backup.sh.
      - alert: БэкапНеСнимался
        expr: >-
          absent(partsflow_backup_success_timestamp_seconds)
          or time() - partsflow_backup_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] бэкап не снимался больше суток'
          description: >-
            Двадцать шесть часов, а не двадцать четыре: суточное расписание
            плюс запас на длинный дамп. Отсутствие отметки вовсе — это тоже
            тревога: значит, задача не запускалась ни разу.

      # Снятый дамп ничего не значит, пока из него не поднялись. Проверка
      # идёт раз в неделю, поэтому и порог недельный с запасом.
      - alert: БэкапНеПроверялся
        expr: >-
          absent(partsflow_backup_verified_timestamp_seconds)
          or time() - partsflow_backup_verified_timestamp_seconds > 9 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] восстановление не проверялось девять дней'
          description: >-
            ops/verify-backup.sh поднимает дамп в отдельную базу и сверяет
            остаток с журналом. Без этого «дамп снялся» — утверждение
            о размере файла, а не о том, что клиента можно вернуть.
