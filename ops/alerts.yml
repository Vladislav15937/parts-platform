# Тревоги ячейки.
#
# Правило одно на все: тревога должна означать «иди и сделай». Всё, на что
# ответ «ну и ладно», сюда не попадает — иначе через месяц уведомления
# перестают читать, и настоящая авария приходит в общей куче.

groups:
  - name: partsflow
    rules:
      # Ячейка не отвечает. Две минуты — это перезапуск при выкладке,
      # больше — уже нет.
      - alert: ЯчейкаНеОтвечает
        expr: up{job="partsflow"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] приложение не отвечает сборщику метрик'
          description: >-
            Метрики не снимаются {{ $value }} — приложение либо упало,
            либо не поднялось после выкладки. Клиенты в это время
            не могут ни принять деталь, ни продать.

      # Тревога на возраст, а не на глубину. Сто событий, появившихся секунду
      # назад, — обычная работа; те же сто возрастом в пять минут — вставший
      # релей, и дельты на площадку уже не уходят.
      - alert: РелейВстал
        expr: partsflow_outbox_oldest_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] событие ждёт отправки больше пяти минут'
          description: >-
            Самое старое неотправленное событие возрастом {{ $value | humanizeDuration }}.
            Релей не разбирает outbox: остаток на площадке разъезжается
            с настоящим, и покупатель приедет за проданной деталью.

      # Пока робот повторяет — делать нечего. Запись, которую он бросил,
      # ждёт человека и сама не рассосётся.
      - alert: НедоставленноеЖдётЧеловека
        expr: partsflow_deadletter_attention > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] {{ $value }} событий брошено роботом'
          description: >-
            Робот исчерпал пять попыток. Разбирается на экране «Доставка»:
            повторить по кнопке или снять без отправки.

      # Бэкап, который тихо перестал сниматься, обнаруживается в день, когда
      # он понадобился. Отметку об успехе кладёт сам ops/backup.sh.
      - alert: БэкапНеСнимался
        expr: >-
          absent(partsflow_backup_success_timestamp_seconds)
          or time() - partsflow_backup_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] бэкап не снимался больше суток'
          description: >-
            Двадцать шесть часов, а не двадцать четыре: суточное расписание
            плюс запас на длинный дамп. Отсутствие отметки вовсе — это тоже
            тревога: значит, задача не запускалась ни разу.

      # Отметка своя, а не общая с дампами, и это не педантизм. Зеркало
      # фотографий снимается тем же скриптом, но другим шагом и в другое
      # хранилище: оно сорвётся отдельно — кончилось место, лёг MinIO, —
      # и общая отметка сказала бы «бэкап снят» при складе без единой
      # картинки. На разборке продаёт фотография, и вернуть клиента
      # без снимков значит вернуть ему список наименований.
      - alert: ФотоНеБэкапились
        expr: >-
          absent(partsflow_photo_backup_success_timestamp_seconds)
          or time() - partsflow_photo_backup_success_timestamp_seconds > 26 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] снимки не копировались больше суток'
          description: >-
            Зеркало хранилища не обновлялось. Дампы базы при этом могли сняться
            штатно — у них своя отметка. Снимки лежат в одном экземпляре
            на одном диске, и восстановить их, кроме как из этой копии,
            неоткуда.

      # Офсайт — отдельная отметка, потому что закрывает отдельную угрозу:
      # дампы и снимки живут на диске самой ячейки, и его гибель уносит
      # клиента вместе с локальным бэкапом. Копия наружу — единственное,
      # что от этого защищает.
      #
      # absent() здесь значит не только «шаг сорвался», но и «OFFSITE_REMOTE
      # не задан вовсе»: ячейка без офсайта не защищена от потери диска,
      # и об этом надо знать, а не обнаружить в день аварии. Порог суточный
      # с запасом, как у дампов. Severity warning, а не critical: локальная
      # копия при этом снята и лежит — данные не потеряны, потеряна защита
      # от гибели машины.
      - alert: ОфсайтНеУезжал
        expr: >-
          absent(partsflow_offsite_backup_success_timestamp_seconds)
          or time() - partsflow_offsite_backup_success_timestamp_seconds > 26 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] бэкап не уезжал наружу больше суток'
          description: >-
            Копия на диске ячейки есть, наружу не уехала. Гибель диска теперь
            уносит и клиента, и его бэкап. Причина — либо сорвавшийся шаг
            (лёг удалённый хост, кончился доступ), либо OFFSITE_REMOTE
            не задан вовсе. На одной машине без офсайта тревога висит,
            пока адрес не задан, — это и есть напоминание.

      # --- Точка возврата: архив WAL ----------------------------------------
      #
      # Дампы отвечают на «вернуть одного клиента», архив WAL — на «не потерять
      # смену»: без него возврат к бэкапу отбрасывает клиента к трём часам
      # ночи, а в 18:00 это принятые детали, проданные позиции и принятые
      # деньги. Поэтому за архивом следят отдельно от дампов: сорваться он
      # может в одиночку, и отметка «бэкап снят» при этом честна.

      # Архиватор встал: сегменты копятся в pg_wal и наружу не уезжают.
      # Это не «потом разберёмся»: точка возврата стоит на месте с той минуты,
      # когда он встал, а заполненный pg_wal в конце концов останавливает базу.
      # Порог по очереди, а не по возрасту последнего сегмента: спокойная
      # ночь законно не даёт новых сегментов, и тревога на возраст кричала бы
      # на исправной ячейке.
      - alert: АрхивWALНеПишется
        expr: partsflow_wal_archive_pending > 5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] {{ $value }} сегментов WAL не уехали в архив'
          description: >-
            Архиватор Postgres не справляется или отбит правами на каталоге
            архива. Точка возврата замерла на последнем уехавшем сегменте,
            а pg_wal растёт — заполнив том, он остановит базу.
            Смотреть: ops/wal-archive.sh и docker logs postgres.

      # Разрыв в цепочке. Самое опасное из всего списка: файлы на месте, размер
      # архива растёт, дампы снимаются — а вернуться можно только до разрыва,
      # и всё, что случилось после, недостижимо. Снаружи не видно ничем,
      # кроме перебора имён сегментов.
      - alert: РазрывВАрхивеWAL
        expr: partsflow_wal_archive_gaps > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] в архиве WAL разрывов: {{ $value }}'
          description: >-
            Цепочка сегментов прервана: восстановление на момент позже разрыва
            невозможно, и Postgres при этом поднимется молча на том, что
            накатилось. До какого момента можно вернуться — скажет
            ops/wal-archive.sh --chain. Нужна новая базовая копия
            (ops/basebackup.sh) сразу же.

      # Сам сторож. absent() здесь значит «задачи нет в cron» — то есть архив
      # пишется, а никто не смотрит, цел ли он. Механизм, о котором никто
      # не спрашивает, работающим не является.
      - alert: СторожАрхиваНеХодит
        expr: >-
          absent(partsflow_wal_check_timestamp_seconds)
          or time() - partsflow_wal_check_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] цепочку архива WAL никто не проверяет'
          description: >-
            ops/wal-archive.sh не отчитывался больше часа (стоит каждые пять
            минут). Либо задача не установлена — ops/install-cron.sh, — либо
            падает. Разрыв в архиве в это время не заметит никто.

      # Офсайт архива — отдельно от ночного офсайта дампов. Дампы за день
      # не меняются, сегменты появляются каждые пять минут: архив, уезжающий
      # раз в сутки, при гибели диска стоит той же потерянной смены, ради
      # которой всё и делалось.
      - alert: АрхивWALНеУезжалНаружу
        expr: >-
          absent(partsflow_wal_offsite_success_timestamp_seconds)
          or time() - partsflow_wal_offsite_success_timestamp_seconds > 2 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] архив WAL не уезжал наружу больше двух часов'
          description: >-
            Сегменты лежат на диске ячейки. Гибель диска уносит и базу,
            и её точку возврата. Причина — сорвавшийся rclone или незаданный
            OFFSITE_REMOTE.

      # Базовая копия. Архив WAL без неё — журнал изменений без начального
      # состояния, то есть ноль пользы при полном виде защищённости.
      # Порог восьмидневный: копия снимается по воскресеньям.
      - alert: БазоваяКопияНеСнималась
        expr: >-
          absent(partsflow_basebackup_success_timestamp_seconds)
          or time() - partsflow_basebackup_success_timestamp_seconds > 8 * 24 * 3600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: '[{{ $externalLabels.cell }}] базовая копия кластера старше недели'
          description: >-
            Накатывать архив WAL не на что: ops/basebackup.sh не отработал.
            Дампы по схемам при этом снимаются — они возвращают клиента
            на 3:00, но не на минуту перед поломкой.

      # И то же, что у дампов: «архив непрерывен» и «к моменту можно
      # вернуться» — разные утверждения. Второе проверяется только накатом,
      # поэтому по понедельникам идёт репетиция возврата.
      - alert: ВозвратНеПроверялся
        expr: >-
          absent(partsflow_pitr_verified_timestamp_seconds)
          or time() - partsflow_pitr_verified_timestamp_seconds > 9 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] возврат к моменту не проверялся девять дней'
          description: >-
            ops/restore-pitr.sh --verify поднимает базовую копию, накатывает
            архив до момента десять минут назад и сверяет реестр с живым.
            Без этого «архив есть» — утверждение о файлах, а не о том,
            что клиента можно вернуть к нужной минуте.

      # Снятый дамп ничего не значит, пока из него не поднялись. Проверка
      # идёт раз в неделю, поэтому и порог недельный с запасом.
      - alert: БэкапНеПроверялся
        expr: >-
          absent(partsflow_backup_verified_timestamp_seconds)
          or time() - partsflow_backup_verified_timestamp_seconds > 9 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: '[{{ $externalLabels.cell }}] восстановление не проверялось девять дней'
          description: >-
            ops/verify-backup.sh поднимает дамп в отдельную базу и сверяет
            остаток с журналом. Без этого «дамп снялся» — утверждение
            о размере файла, а не о том, что клиента можно вернуть.
