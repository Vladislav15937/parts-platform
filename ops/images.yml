# Образы, которые мы держим в своём реестре, — и ЕДИНСТВЕННОЕ место,
# где записан их адрес.
#
# ЗАЧЕМ ОДНО МЕСТО. До 26 сентября 2026 адрес был написан пять раз: три теста
# с настоящим хранилищем (PhotoServiceTest, PhotoArchiveStreamTest,
# PhotoMigrationTest) и оба compose. Пять копий одного значения расходятся
# молча — правка трогает четыре и забывает пятую, — а цена расхождения здесь
# особая: тест обязан гонять то, что стоит в бою. Правка адреса без сведения
# сделала бы шестую копию (задача 0180, пункт 2).
#
# КТО ЭТО ЧИТАЕТ:
#   — оба compose, через `include:` (docker-compose.yml, docker-compose.prod.yml);
#   — три теста, через support/TestImages — он разбирает этот файл;
#   — tools/mirror-images.sh — он же кладёт образы в реестр;
#   — tools/image-pin-guard.py — стережёт, что шестой копии не появилось.
#
# Файл лежит в `ops/` не по смыслу, а по дороге: на ячейку уезжает `ops/`
# целиком и `docker-compose.prod.yml` (rsync в .github/workflows/deploy.yml).
# Положи его в корень — и боевой compose на ячейке не собрался бы вовсе,
# потому что включать было бы нечего.
#
# ПОЧЕМУ ОБРАЗЫ НАШИ, А НЕ ЧУЖИЕ. 26 сентября 2026 `quay.io/minio/minio`
# пропал целиком — не тег, а репозиторий: `main` покраснела у всех, и три
# теста с настоящим MinIO не могли поднять хранилище. Годом раньше то же
# случилось с ним на Docker Hub, и тогда переехали на quay. Решение владельца
# того дня — «своё зеркало в GHCR»; два других варианта отклонены вслух:
# другой публичный источник («третий переезд по той же причине») и вход
# на quay по учётной записи («зависимость от чужой учётной записи»).
#
# ТЕГ ЗАКРЕПЛЁН, И ПЛАВАЮЩИМ БЫТЬ НЕ МОЖЕТ. `latest` перевыкачивается,
# зависит от доступности реестра в конкретную минуту и меняется под ногами —
# запрет записан в корневом CLAUDE.md и стережётся tools/image-pin-guard.py.
#
# Пакеты публичные: вход в реестр не нужен ни CI, ни разработчику, ни ячейке.
# Довод и цена выбора — в ops/CLAUDE.md, «Зеркало образов хранилища».
services:
  minio:
    image: ghcr.io/vladislav15937/parts-platform/minio:RELEASE.2025-09-07T16-13-09Z

  # Клиент хранилища: им ops/backup.sh увозит снимки, а восстановление
  # возвращает их обратно. Образ был мёртв ровно так же, как minio, — тот же
  # исчезнувший реестр, — и обнаружилось бы это в день, когда снимки клиента
  # понадобится вернуть из копии.
  #
  # Профиль `backup` стоит здесь, а не только в боевом compose: без него
  # фрагмент поднимал бы клиента и в разработке, где он никому не нужен.
  mc:
    image: ghcr.io/vladislav15937/parts-platform/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [backup]
