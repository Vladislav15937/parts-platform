# Образы, которые мы держим в своём реестре, — и ЕДИНСТВЕННОЕ место,
# где записан их адрес.
#
# ЗАЧЕМ ОДНО МЕСТО. До 26 сентября 2026 адрес был написан пять раз: три теста
# с настоящим хранилищем (PhotoServiceTest, PhotoArchiveStreamTest,
# PhotoMigrationTest) и оба compose. Пять копий одного значения расходятся
# молча — правка трогает четыре и забывает пятую, — а цена расхождения здесь
# особая: тест обязан гонять то, что стоит в бою. Правка адреса без сведения
# сделала бы шестую копию (задача 0180, пункт 2).
#
# КТО ЭТО ЧИТАЕТ:
#   — оба compose, через `extends:` (docker-compose.yml, docker-compose.prod.yml);
#   — три теста, через support/TestImages — он разбирает этот файл;
#   — tools/mirror-images.sh — он же кладёт образы в реестр;
#   — tools/image-pin-guard.py — стережёт, что шестой копии не появилось.
#
# Файл лежит в `ops/` не по смыслу, а по дороге: на ячейку уезжает `ops/`
# целиком и `docker-compose.prod.yml` (rsync в .github/workflows/deploy.yml).
# Положи его в корень — и боевой compose на ячейке не собрался бы вовсе,
# потому что включать было бы нечего.
#
# ПОЧЕМУ ОБРАЗЫ НАШИ, А НЕ ЧУЖИЕ. 26 сентября 2026 `quay.io/minio/minio`
# пропал целиком — не тег, а репозиторий: `main` покраснела у всех, и три
# теста с настоящим MinIO не могли поднять хранилище. Годом раньше то же
# случилось с ним на Docker Hub, и тогда переехали на quay. Решение владельца
# того дня — «своё зеркало в GHCR»; два других варианта отклонены вслух:
# другой публичный источник («третий переезд по той же причине») и вход
# на quay по учётной записи («зависимость от чужой учётной записи»).
#
# ТЕГ ЗАКРЕПЛЁН, И ПЛАВАЮЩИМ БЫТЬ НЕ МОЖЕТ. `latest` перевыкачивается,
# зависит от доступности реестра в конкретную минуту и меняется под ногами —
# запрет записан в корневом CLAUDE.md и стережётся tools/image-pin-guard.py.
#
# Пакеты публичные: вход в реестр не нужен ни CI, ни разработчику, ни ячейке.
# Довод и цена выбора — в ops/CLAUDE.md, «Зеркало образов хранилища».
#
# ПОЧЕМУ `extends`, А НЕ `include` — и почему это выяснилось только на CI.
# Первая редакция включала фрагмент целиком (`include: [ops/images.yml]`),
# и у себя это работало: compose v5 из Docker Desktop дополняет сервис
# того же имени молча. Compose v2 на раннере — отказывается:
# «services.minio conflicts with imported resource», то есть включённый
# сервис дополнять нельзя вовсе. `extends` для этого и существует: берём
# из фрагмента одну строку и дописываем остальное у себя.
#
# Ловушка та же, что у кэша образа: «локально зелено» ничего не значит,
# когда версия инструмента у себя новее боевой.
#
# ЗЕРКАЛЯТСЯ ДВУМЯ СПОСОБАМИ, И ВЫБОР НЕ ВКУСОВОЙ. У minio и mc официального
# образа не осталось нигде — их мы СОБИРАЕМ из файлов выпуска
# (tools/mirror/*.Dockerfile). У postgres и liquibase автор образа жив
# и раздаёт его на Docker Hub — их мы КОПИРУЕМ оттуда как есть, не пересобирая:
# база данных, собранная нами из чужих кусков, была бы другим продуктом,
# а не тем, что стоит в бою. Что чем зеркалится, сказано ниже списком
# источников: есть источник — копируем, нет — собираем.
#
# ЗАЧЕМ КОПИРОВАТЬ ЖИВОЕ. 13 сентября 2026 задача CI «Миграции на чистой базе»
# упала на выкачке `liquibase/liquibase:4.27`: «read: connection reset by peer»
# от registry-1.docker.io. Кода это не касалось вовсе. Образ никуда не девался —
# просто чужой реестр в ту минуту не ответил, и красный CI без дефекта стоит
# дороже, чем выглядит: исполнитель идёт искать причину у себя, а проверяющий
# рискует вынести вердикт по ложному красному (задача 0095).
#
# ТЕГ ЗЕРКАЛА НЕСЁТ СУММУ ИСТОЧНИКА, И ЭТО НЕ УКРАШЕНИЕ. `16-alpine`
# у автора образа ПЛЫВЁТ — под ним лежит то 16.15, то 16.16, — а наш тег
# закреплён навсегда: он назван суммой того индекса, который мы скопировали.
# Отсюда два следствия. Первое: прогон повторяем, чего про исходный `16-alpine`
# сказать нельзя. Второе, важнее: сменив источник, вы обязаны сменить и тег, —
# и тогда задача CI «Зеркало образов» видит, что такого тега в реестре нет,
# и копирует заново. Оставь тег прежним — и она честно ответит «зеркало
# на месте», а в реестре продолжали бы лежать прежние байты.
x-mirror-sources:
  # Откуда копируется зеркало. Закреплено ПО СУММЕ, а не по тегу: тег у автора
  # плывёт, сумма — нет. Читают это tools/mirror-images.sh (копирует) и
  # tools/image-pin-guard.py (сверяет, что тег зеркала назван этой суммой).
  postgres: docker.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  liquibase: docker.io/liquibase/liquibase:4.27@sha256:141a9fb5df99e43be49e507dc1892a65cd7b93c9e662c4212e834468df959983

services:
  minio:
    image: ghcr.io/vladislav15937/parts-platform/minio:RELEASE.2025-09-07T16-13-09Z

  # Клиент хранилища: им ops/backup.sh увозит снимки, а восстановление
  # возвращает их обратно. Образ был мёртв ровно так же, как minio, — тот же
  # исчезнувший реестр, — и обнаружилось бы это в день, когда снимки клиента
  # понадобится вернуть из копии.
  #
  # Ни профиля, ни команды здесь нет: фрагмент — это адрес, а не сервис.
  # Всё остальное (профиль `backup`, точка входа, ключи) стоит там, где этот
  # адрес берут, — в боевом compose. В разработке клиента нет вовсе.
  mc:
    image: ghcr.io/vladislav15937/parts-platform/mc:RELEASE.2025-08-13T08-35-41Z

  # База под прогон миграций и под тесты. Копия того самого образа с Docker Hub,
  # байт в байт: сумма источника стоит и в теге, и в списке выше.
  #
  # КТО ЭТО БЕРЁТ — только прогон: db/docker-compose.yml (задачи CI «Миграции
  # на чистой базе» и «Откат по шагам») и PostgresTestBase (задача «Бэкенд»).
  # Compose разработки, боевой compose и ops/restore-pitr.sh взяты НЕ были,
  # и это названное решение, а не забывчивость: там тот же образ поднимает
  # живую базу клиента, её точку возврата и её физическую копию, а смена адреса
  # означает пересоздание контейнера базы — то есть отдельную задачу
  # с репетицией восстановления. Довод и цена — ops/CLAUDE.md, «Зеркало
  # образов: что зеркалится, а что названо очередью».
  postgres:
    image: ghcr.io/vladislav15937/parts-platform/postgres:16-alpine-721873c34ceb

  # Liquibase для db/verify.sh и db/verify-rollback.py — тот самый образ,
  # на выкачке которого 13 сентября 2026 упала задача «Миграции на чистой базе».
  # В бою этого образа нет вовсе: схемы накатывает приложение своим jar
  # (TenantSchemaMigrator, ops/schema-sync.sh), а этот контейнер живёт только
  # в прогоне. Значит «тест обязан гонять то, что стоит в бою» здесь про версию
  # библиотеки в pom.xml, а не про образ.
  liquibase:
    image: ghcr.io/vladislav15937/parts-platform/liquibase:4.27-141a9fb5df99
