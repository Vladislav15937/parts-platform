spring:
  application:
    name: parts-platform
  profiles:
    default: local

  datasource:
    # Адрес и учётные данные приходят окружением: в бою база не на localhost,
    # а пароль в репозитории — это пароль, который знают все.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parts}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 20
      # Таймауты защищают от запроса, который встал на блокировке и держит
      # соединение: лучше упасть быстро, чем исчерпать пул.
      connection-init-sql: SET lock_timeout = '5s'

  jpa:
    open-in-view: false
    hibernate:
      # Именно none, а не validate: при схеме-на-арендатора на старте нет
      # контекста арендатора, и валидировать Hibernate было бы нечего —
      # в public таблиц с данными нет. Схему проверяют миграции и тесты.
      ddl-auto: none
    properties:
      hibernate:
        # Мультиарендность включается регистрацией MultiTenantConnectionProvider
        # в MultiTenancyConfig: в Hibernate 6 настройки multiTenancy больше нет.
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      # Выгрузка склада переехавшего клиента — это десятки мегабайт: у живого
      # клиента на 35 875 позиций файл весит 24,7 МБ. Умолчание Spring —
      # мегабайт на файл и десять на запрос, то есть перенос падал бы у всех,
      # кроме самых мелких, и падал бы пятисоткой на первом же шаге.
      #
      # Память это не съедает: Tomcat пишет загруженное на диск, а импортёр
      # и дальше работает с файлом, а не с потоком.
      max-file-size: 64MB
      max-request-size: 128MB

  # Миграции гонит отдельный оркестратор (схема на арендатора), не старт приложения.
  liquibase:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # acks=all и min.insync.replicas=2 работают только в паре.
      # По отдельности каждая настройка бесполезна.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # Коммит офсета только после успешной обработки. Никогда не true.
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        # Слушатель подписан шаблоном (топик заводится на каждый тип события),
        # а новый топик потребитель замечает только при обновлении метаданных.
        # С умолчанием в пять минут первое событие каждого нового типа столько
        # и лежит: живой прогон на чистой ячейке показал 195 секунд от
        # публикации до обработки при исправном брокере — и выглядит это как
        # потерянное событие, а не как ожидание. Тридцать секунд стоят одного
        # небольшого запроса к брокеру в полминуты.
        metadata.max.age.ms: 30000

server:
  # За терминатором приложение обязано знать, что запрос пришёл по https:
  # иначе request.isSecure() ложно, cookie сессии уходит без флага Secure
  # и утечёт в первый же http-запрос к тому же домену.
  #
  # В бою — native, а не framework, и это не вкусовщина. Проверено живым
  # прогоном: с framework флаг Secure получает только CSRF-cookie, потому
  # что фильтр Spring оборачивает запрос выше уровня, на котором Tomcat
  # создаёт JSESSIONID. Клапан Tomcat отрабатывает раньше — и cookie сессии
  # тоже уходит с Secure.
  #
  # Умолчание none: в разработке терминатора нет, и доверять X-Forwarded-Proto
  # от кого угодно значит позволить подделать протокол тому, кто дотянулся
  # до порта приложения.
  forward-headers-strategy: ${FORWARD_HEADERS:none}

app:
  # Имя ячейки: префикс топиков Kafka и метка на тревогах наблюдения.
  cell: ${APP_CELL:cell01}

  # Адрес, по которому приложение видно снаружи. Нужен ссылкам на снимки
  # в прайсе площадки: за терминатором адрес из запроса — это внутреннее имя
  # контейнера, и прайс уехал бы со ссылками вида http://app:8080/…,
  # по которым площадка не сходит никуда. Пусто — адрес берётся из запроса,
  # и это верно только в разработке.
  public-url: ${PUBLIC_ORIGIN:}

  # Номер ячейки — старший разряд номера арендатора: у второй ячейки клиенты
  # начинаются с 2 000 001. Без этого схема t_000001 есть в обеих, и дамп
  # из одной нельзя развернуть в другую без переименования — а переносить
  # клиента между ячейками придётся при первой же перебалансировке.
  # Менять у работающей ячейки нельзя: заведённые номера от этого не двинутся,
  # а новые уедут в чужой диапазон.
  cell-number: ${APP_CELL_NUMBER:1}
  # Секрет создания арендатора. Пустой — механизм выключен, и это верное
  # значение по умолчанию: забытый включённым, он даёт любому желающему
  # заводить схемы в базе, пока не кончится диск. Задавать переменной окружения
  # APP_PROVISIONINGTOKEN на время подключения клиента.
  provisioning-token: "${APP_PROVISIONING_TOKEN:}"

  crypto:
    # Ключ шифрования секретов площадок: 32 байта в base64.
    # Пустой — механизм выключен: приложение поднимется, но завести ключ
    # кабинета не даст, а не запишет его открытым текстом молча.
    # В бою задавать переменной окружения APP_CRYPTO_KEY, а не здесь:
    # ключ в репозитории равносилен отсутствию шифрования.
    # Сгенерировать: openssl rand -base64 32
    key: "${APP_CRYPTO_KEY:}"

  outbox:
    relay-delay-ms: 1000
    # Срок заявки на пачку событий. Отправка идёт вне транзакции, поэтому
    # «эту пачку уже отправляют» держится отметкой в строке, а не блокировкой.
    # Срок обязан быть заметно больше, чем delivery.timeout.ms продюсера
    # (две минуты): иначе заявка истечёт, пока отправка ещё идёт, и второй
    # заход отправит то же самое повторно. Меньше — лишние дубли,
    # сильно больше — событие, потерянное упавшим процессом, ждёт впустую.
    claim-ttl: 5m

  # Хранилище фотографий. В разработке MinIO из docker-compose, у клиентов —
  # обычный S3: протокол один, меняются только адрес и ключи.
  # Накат общей схемы catalog при старте. Схемы арендаторов сюда не входят:
  # их мигрирует провижининг, и гонять пятьсот схем на подъёме приложения
  # значит держать его недоступным минуты.
  migrate-catalog-on-start: ${MIGRATE_CATALOG:true}

  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Адрес для подписанных ссылок. На localhost совпадает с внутренним,
    # в бою это внешнее имя: подпись включает хост, и ссылка, подписанная
    # внутренним адресом, с телефона не откроется.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: us-east-1
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:parts-photos}
    # MinIO не умеет виртуальные хосты вида bucket.localhost.
    path-style-access: ${S3_PATH_STYLE:true}
    upload-url-ttl: 15m
    view-url-ttl: 6h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    # В бою переопределяется на INFO: DEBUG на пятидесяти тысячах позиций
    # пишет журнал быстрее, чем его успевают читать.
    ru.partsflow: ${LOG_LEVEL:DEBUG}

---
spring:
  config:
    activate:
      on-profile: kafka
# Профиль включает KafkaEventTransport вместо in-memory.
