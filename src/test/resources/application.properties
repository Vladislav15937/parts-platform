# Пул для тестов — маленький намеренно.
#
# Каждый @SpringBootTest с иным набором свойств поднимает свой контекст,
# и Spring держит их в кэше одновременно (до 32). При боевом пуле в 20
# соединений полтора десятка контекстов съедают несколько сотен соединений
# и упираются в max_connections: падает при этом не тот тест, который
# виноват, а тот, что запустился последним.
#
# Здесь, а не в @DynamicPropertySource: тот старше свойств @SpringBootTest
# и молча отменил бы пул из одного соединения, на котором держится
# TenantIsolationTest. Файл ресурсов ниже приоритетом — и его настройка
# как раз перебивается индивидуальной.
spring.datasource.hikari.maximum-pool-size=5

# Хранилища у большинства тестовых контекстов нет: MinIO поднимает только
# PhotoServiceTest, своим контейнером. Проверка бакета при старте валила бы
# все остальные контексты — на CI её и поймало, локально нет, потому что
# рядом крутится MinIO из compose разработки.
#
# Выключено здесь, а не маркерным свойством в тестах: файл ресурсов общий
# на все контексты и лишнего Spring не поднимает. Сама проверка при этом
# не остаётся непокрытой — её включает PhotoServiceTest, у которого MinIO
# настоящий.
app.s3.ensure-bucket=false
