# База под verify.sh — она же единственный её потребитель.
#
# Портов наружу не публикует НИ ОДИН сервис, и это не экономия: 5432 держит
# среда разработки (корневой docker-compose.yml), а при нескольких рабочих
# копиях разом — ещё и соседний прогон. Опубликованный порт делает проверку
# общим ресурсом: она не запускается, пока сосед не погасит свою базу,
# и разбор выносит вердикт по чтению кода вместо живого наката.
# Публиковать нечего по существу: verify.sh ходит в базу через
# `docker compose exec`, а Liquibase — из соседнего контейнера по сети
# compose (`postgres:5432`). С хоста база достаётся тем же exec'ом:
#   docker compose -p <проект> exec postgres psql -U app -d parts
# Имя проекта печатает сам verify.sh — оно своё у каждой рабочей копии.
#
# Адресов образов здесь нет намеренно: оба приходят из ops/images.yml — одного
# места на весь проект. 13 сентября 2026 эта проверка упала на выкачке
# `liquibase/liquibase:4.27` с Docker Hub («connection reset by peer»), при
# совершенно исправном коде: красный CI без дефекта уводит исполнителя искать
# причину у себя, а проверяющего — судить по ложному красному (задача 0095).
# Теперь оба образа тянутся из нашего GHCR, и недоступность Docker Hub прогон
# миграций не останавливает. Наполняет зеркало tools/mirror-images.sh, задача
# CI «Зеркало образов» зовёт его сама.
services:
  postgres:
    extends:
      file: ../ops/images.yml
      service: postgres
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d parts"]
      interval: 2s
      timeout: 3s
      retries: 30

  liquibase:
    extends:
      file: ../ops/images.yml
      service: liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/liquibase/workspace
    working_dir: /liquibase/workspace
    entrypoint: ["sleep", "infinity"]
