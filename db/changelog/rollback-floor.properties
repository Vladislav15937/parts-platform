# Нижняя граница отката схемы — объявленная, а не подразумеваемая (задача 0102).
#
# ЧТО ЭТО. Самая младшая версия, до которой откат вниз ВОЗВРАЩАЕТ СХЕМУ ровно
# к тому виду, какой она на этой версии имела. Ниже неё инструменты отказывают
# и называют эту границу: `SchemaSync` (то есть `ops/schema-sync.sh --to` и
# кнопка раскатки) и `db/rollback-cost.py`.
#
# ПОЧЕМУ ГРАНИЦА, А НЕ ВТОРОЙ МОСТ ОТКАТА. Одиннадцать выпущенных откатов схему
# не возвращают: восемь changeset'ов волны «логика в Java» (046–050) несут
# `--rollback SELECT 1`, `tenant-046-rename-feed-dirty` не переименовывает
# обратно ключи и индекс, а два не возвращают снятый NOT NULL. Все одиннадцать
# лежат ниже этой границы. Довод целиком — в db/CLAUDE.md, раздел «Нижняя
# граница отката объявлена»; коротко: мост отката срабатывает на СВОЁЙ позиции
# в манифесте, а дописать его можно только в конец — значит откат на один-два
# шага с вершины воскрешал бы `stock_movement_apply`, `audit_trigger` и ещё
# двадцать триггеров поверх работающего Java-кода, который делает то же самое.
# Молчаливый отказ на пути, которым не ходят, сменился бы двойным списанием
# остатка на пути, которым ходят каждую выкладку.
#
# ЗАМЕРЕНО, А НЕ ВЫВЕДЕНО. Схема, собранная накатом ровно до 122, и схема,
# полученная накатом до вершины и откатом до 122, сходятся объект в объект
# (324 объекта). До 121 — уже нет (лишняя функция и три генерируемые колонки,
# названная цена моста tenant/054), до 107 — не возвращается 35 объектов:
# десять функций, двадцать один триггер, имена ключа, внешнего ключа и индекса.
#
# ФОРМАТ — тот же, что у отметки версии в реестре: «число changeset'ов косая
# идентификатор последнего». Число сравнимо, идентификатор читаем человеком,
# и оба проверяются: `db/verify-rollback.py` и `TenantSchemaMigrator` сверяют
# пару с самим changelog'ом и отказываются работать, если она разъехалась.
#
# ПОДНЯТЬ ГРАНИЦУ — РЕШЕНИЕ, А НЕ ФОРМАЛЬНОСТЬ: каждый шаг вверх отнимает
# у выкладки способность вернуться на соответствующую сборку. Опустить её
# можно только починив откаты, которые её держат, — новым changeset'ом.
tenant=122/tenant-054-rollback-bridge
