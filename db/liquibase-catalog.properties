# Общий каталог ячейки. Накатывается один раз на базу.
#   liquibase --defaults-file=liquibase-catalog.properties update

changelogFile=changelog/db.changelog-catalog.xml
url=jdbc:postgresql://localhost:5432/parts
username=app
password=${DB_PASSWORD}
driver=org.postgresql.Driver

# Служебные таблицы каталога — в public.
liquibaseSchemaName=public

# Ошибка в чек-сумме должна валить деплой, а не молча пропускаться.
strict=true

# Разумные потолки: ALTER, взявший тяжёлую блокировку на таблице крупного
# клиента в разгар рабочего дня, положит ему работу.
# Задаются через JDBC-параметры соединения.
# url=jdbc:postgresql://localhost:5432/parts?options=-c%20lock_timeout%3D5s%20-c%20statement_timeout%3D300s
