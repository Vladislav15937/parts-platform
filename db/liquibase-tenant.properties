# Схема одного арендатора.
#   liquibase --defaults-file=liquibase-tenant.properties \
#             -Dtenant.schema=t_000042 \
#             --default-schema-name=t_000042 \
#             --liquibase-schema-name=t_000042 \
#             update
#
# defaultSchemaName и liquibaseSchemaName передаются флагами, а не здесь:
# файл один на всех арендаторов, значение — своё на каждого.

changelogFile=changelog/db.changelog-tenant.xml
url=jdbc:postgresql://localhost:5432/parts
username=app
password=${DB_PASSWORD}
driver=org.postgresql.Driver

strict=true
