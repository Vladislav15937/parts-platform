# Адреса зеркалённых образов — в ops/images.yml, и это одно место на весь
# проект: тот же фрагмент включает боевой compose, ту же строку читают три
# теста с настоящим хранилищем. Включением, а не копией строки, потому что
# пять копий одного адреса разъезжаются молча — правка трогает четыре
# (задача 0180, 26 сентября 2026).
include:
  - ops/images.yml

services:
  postgres:
    image: postgres:16-alpine
    # Разделяемая память под параллельные планы. Умолчание Docker — 64 МБ,
    # и на ячейке в 500 арендаторов этого не хватает: обход системного
    # каталога идёт параллельными воркерами, и pg_dump всей базы падает
    # с «could not resize shared memory segment: No space left on device».
    # Проверено на пробе: 22 582 таблицы, 93 713 индексов.
    shm_size: 1gb
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d parts"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka в KRaft-режиме: без ZooKeeper.
  # Один брокер — для разработки. В проде минимум три на РАЗНЫХ машинах:
  # replication.factor=3 на одном хосте не даёт отказоустойчивости,
  # только иллюзию — падение хоста уносит все реплики сразу.
  #
  # Образ официальный apache/kafka, а не bitnami: последние удалены
  # из реестра после смены политики Bitnami, и `docker compose up`
  # переставал работать целиком, включая postgres.
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # На одном брокере всё равно одна реплика: значения по умолчанию (3)
      # не дадут создать ни одного служебного топика.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data

  # S3-совместимое хранилище для фотографий.
  # Телефон грузит оригиналы сюда напрямую по presigned URL, минуя бэкенд:
  # это снимает трафик и таймауты на плохой связи в ангаре.
  # Адреса образа здесь нет намеренно: он приходит из ops/images.yml
  # (включён выше). Что важно знать, не открывая фрагмент:
  #
  #   — тег закреплён. Плавающий `latest` перевыкачивается и меняется под
  #     ногами: вчера прогон шёл на одном образе, сегодня на другом, и разница
  #     видна только по красному CI. Соседи закреплены с самого начала
  #     (postgres:16-alpine, apache/kafka:3.8.1);
  #   — та же строка достаётся трём тестам с настоящим хранилищем и боевому
  #     compose: тест обязан гонять то, что стоит в бою;
  #   — образ наш. `minio/minio` убран с Docker Hub (отсюда красная main
  #     12 сентября 2026), а 26 сентября 2026 с quay.io пропал весь
  #     репозиторий — и `main` покраснела снова, у всех сразу. Третьего
  #     переезда не будет: зеркало лежит в нашем GHCR, и кладёт его туда
  #     tools/mirror-images.sh.
  minio:
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  kafkadata:
  miniodata:
