services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d parts"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka в KRaft-режиме: без ZooKeeper.
  # Один брокер — для разработки. В проде минимум три на РАЗНЫХ машинах:
  # replication.factor=3 на одном хосте не даёт отказоустойчивости,
  # только иллюзию — падение хоста уносит все реплики сразу.
  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafkadata:/bitnami/kafka

  # S3-совместимое хранилище для фотографий.
  # Телефон грузит оригиналы сюда напрямую по presigned URL, минуя бэкенд:
  # это снимает трафик и таймауты на плохой связи в ангаре.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  kafkadata:
  miniodata:
