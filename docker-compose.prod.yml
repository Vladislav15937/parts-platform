# Развёртывание ячейки.
#
# Одна ячейка — это комплект Postgres + S3 на группу арендаторов (до ~200).
# Отдельный кластер на клиента не делаем: при пятистах клиентах это
# 12–22 млн ₽/мес против 150–450 ₽ на арендатора в ячейке.
#
#   cp .env.example .env   # заполнить секреты и домены
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Наружу смотрит только терминатор: 80 и 443. Приложение и хранилище портов
# на хосте не занимают — до них можно дойти лишь через него.
#
# Kafka по умолчанию выключена: профиль по умолчанию работает на транспорте
# в памяти, и первым клиентам этого достаточно. Брокер нужен, когда экземпляров
# приложения становится больше одного — при in-memory транспорте событие
# обрабатывается там же, где родилось, и второй экземпляр про него не узнает.
#
# Включается своим профилем compose, вместе с профилем Spring:
#
#   SPRING_PROFILES=kafka docker compose -f docker-compose.prod.yml \
#       --profile kafka up -d
#
# Порядок при включении: сначала поднять брокер, потом переключить приложение.
# Наоборот — приложение секунду за секундой не может отправить накопленное,
# и релей крутится вхолостую до появления Kafka. Событий он при этом
# не теряет: неопубликованное лежит в outbox, пока не уедет.

# Имя проекта включает имя ячейки, и это не косметика: имя проекта задаёт
# имена томов. Две ячейки с одним именем делят базу и хранилище — то есть
# перестают быть двумя ячейками, а обнаруживается это по чужим клиентам
# в реестре.
#
# И оно своё, а не унаследованное от каталога: иначе тома совпадают с теми,
# что поднимает docker-compose.yml для разработки, а Postgres инициализирует
# пользователя только на пустом каталоге данных. Боевая ячейка тогда либо
# молча поднимается на базе с dev-паролем, либо не поднимается вовсе
# с «password authentication failed», и причина не видна ни в одном логе.
name: partsflow-${APP_CELL:-cell01}

services:
  # Терминатор: сертификаты, шифрование и ограничение управляющего контура.
  #
  # Без него не работает приёмка: камера в браузере доступна только
  # в защищённом контексте. По http нет ни съёмки деталей, ни сканирования
  # ячеек и VIN — то есть нет половины продукта, а не «нет замочка в адресе».
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - minio
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?укажите APP_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN:?укажите S3_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?укажите ACME_EMAIL}
      # Откуда разрешено ходить в /api/provisioning. Умолчание — петля,
      # то есть «только с самой машины через docker compose exec».
      PROVISIONING_ALLOW: ${PROVISIONING_ALLOW:-127.0.0.1/32}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты переживают пересоздание контейнера. Без этого тома каждый
      # перезапуск — новый выпуск, а у Let's Encrypt на это недельный предел:
      # упрёшься в него в худший момент, во время разбора аварии.
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/parts
      DB_USER: ${DB_USER:?укажите DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?укажите DB_PASSWORD}

      # Секрет создания арендаторов. Пустой выключает механизм — так и надо
      # держать между подключениями клиентов.
      APP_PROVISIONING_TOKEN: ${APP_PROVISIONING_TOKEN:-}

      # Ключ шифрования секретов площадок, 32 байта в base64.
      # Потеряете — ключи кабинетов не расшифруются, и их придётся
      # запрашивать у площадок заново. Держите копию отдельно от бэкапа базы:
      # вместе они дают то же, что и открытый текст.
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:?укажите APP_CRYPTO_KEY}

      # Транспорт событий. Пусто — профиль по умолчанию, транспорт в памяти.
      # Значение kafka включает KafkaEventTransport и слушателя; поднимать
      # брокер надо профилем compose (см. шапку файла).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-}
      KAFKA_SERVERS: kafka:9092

      # Адрес приложения снаружи. Из него строятся постоянные ссылки
      # на снимки в прайсе площадки: адрес из запроса за терминатором —
      # это app:8080, и площадка по такой ссылке не сходит никуда.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?укажите PUBLIC_ORIGIN}

      S3_ENDPOINT: http://minio:9000
      # Внешнее имя: хост входит в подпись, и ссылка, подписанная внутренним
      # адресом, с телефона приёмщика не откроется.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?укажите S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?укажите S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?укажите S3_SECRET_KEY}

      # Приложение стоит за терминатором и без этого считает запрос
      # незашифрованным: cookie сессии уйдёт без флага Secure, то есть
      # утечёт в первый же http-запрос к тому же домену.
      #
      # Именно native: с framework Secure получает только CSRF-cookie —
      # см. комментарий в application.yml.
      #
      # Доверять этим заголовкам можно ровно потому, что порт приложения
      # наружу не выставлен: подделать X-Forwarded-Proto может лишь тот,
      # кто уже внутри сети docker.
      FORWARD_HEADERS: native

      # Имя ячейки — префикс топиков Kafka и метка на тревогах.
      APP_CELL: ${APP_CELL:-cell01}
      # Номер ячейки — старший разряд номера арендатора. У второй ячейки
      # клиенты начинаются с 2 000 001, и дамп из неё разворачивается
      # в соседнюю без переименования схем.
      APP_CELL_NUMBER: ${APP_CELL_NUMBER:-1}

      LOG_LEVEL: INFO
    # Порт наружу не публикуется намеренно: единственный вход — терминатор.
    # Открытый 8080 сводит на нет и сертификат, и ограничение по адресам.
    expose:
      - "8080"

  # Брокер. Поднимается только с профилем kafka — без него приложение
  # работает на транспорте в памяти, и лишний контейнер означал бы лишний
  # источник отказов при одном экземпляре приложения.
  #
  # depends_on у приложения на него нет намеренно: compose включил бы этот
  # профиль сам, и брокер поднимался бы всегда. Отсутствие брокера приложение
  # переживает — неотправленное лежит в outbox.
  kafka:
    # Образ официальный apache/kafka, а не bitnami: последние удалены
    # из реестра после смены политики Bitnami, и `docker compose up`
    # переставал работать целиком, включая postgres. Ровно та же причина,
    # что и в docker-compose.yml для разработки.
    image: apache/kafka:3.8.1
    restart: unless-stopped
    profiles: [kafka]
    environment:
      # KRaft: без ZooKeeper. Один узел — это ячейка, а не кластер на всех.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Имя, по которому брокер зовут изнутри сети docker. Приложение ходит
      # в него по имени сервиса, снаружи в брокер не ходит никто.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Топик заводится на каждый тип события, а перечислять их в конфигурации
      # значит править её при каждом новом — слушатель подписан шаблоном.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # На одном узле реплика может быть только одна: значения по умолчанию
      # не дадут создать ни одного служебного топика. Появится второй узел —
      # поднимать до 3 и 2, иначе пара acks=all с min.insync.replicas
      # у продюсера не защищает ни от чего.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    # Наружу не выставляется: в брокер ходит только приложение.
    expose:
      - "9092"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: ${DB_USER:?укажите DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?укажите DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d parts"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Наружу не выставляется: к базе ходит только приложение. Для бэкапа
    # и разбора — docker compose exec, а не открытый в интернет 5432.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?укажите S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?укажите S3_SECRET_KEY}
      # Телефон грузит снимок прямо в хранилище по подписанной ссылке,
      # то есть из браузера и с другого источника. Без CORS браузер отбивает
      # запрос ещё до отправки, а приложению это выглядит как обрыв связи.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN:?укажите PUBLIC_ORIGIN}
    volumes:
      - miniodata:/data
    # Хранилище доступно телефону напрямую — файл идёт мимо приложения
    # намеренно, — но через терминатор: подписанная ссылка ведёт на https,
    # а по http браузер её и не отправит со страницы приложения.
    expose:
      - "9000"

  # Клиент хранилища для бэкапа и восстановления фотографий.
  #
  # Отдельным сервисом, а не `docker run`: так он в той же сети, что и minio,
  # и ходит к нему по имени, не открывая порт наружу. Профиль `backup` держит
  # его выключенным — он запускается разово, из ops/backup.sh:
  #
  #   docker compose -f docker-compose.prod.yml run --rm -v /путь:/backup mc mirror …
  #
  # Каталог бэкапов монтируется флагом при запуске, а не здесь: его путь знает
  # только скрипт, из файла окружения, и повторять здесь тот же расчёт значит
  # однажды разойтись с ним и писать копию не туда.
  mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [backup]
    environment:
      # mc читает MC_HOST_<псевдоним> из окружения. Так ключи не попадают
      # ни в аргументы команды, ни в историю оболочки, ни в `docker ps`.
      MC_HOST_cell: http://${S3_ACCESS_KEY:?укажите S3_ACCESS_KEY}:${S3_SECRET_KEY:?укажите S3_SECRET_KEY}@minio:9000
    entrypoint: ["mc"]
    command: ["--version"]

  # Наблюдение. Три маленьких контейнера, и все три обязательны, а не
  # «на будущее»: без сборщика метрики просто отдаются в пустоту, а без
  # адресата тревога никуда не уходит — то есть об остановившемся релее
  # оператор узнаёт от клиента.
  #
  # Наружу ни один порт не выставлен. Смотреть их снаружи незачем: правила
  # лежат в репозитории, а состояние приходит в Telegram.
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    depends_on:
      - app
    # Своя точка входа по той же причине, что и у alertmanager: имя ячейки
    # надо подставить в конфигурацию, а окружение Prometheus в ней
    # не разворачивает. Без метки тревога «Релей встал» не говорит, в какой
    # из двух ячеек он встал, — то есть не говорит ничего.
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        sed "s/ЯЧЕЙКА_ПОДСТАВЛЯЕТСЯ/$$APP_CELL/"
        /etc/prometheus/prometheus.yml > /tmp/prometheus.yml &&
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.retention.time=14d
    environment:
      APP_CELL: ${APP_CELL:-cell01}
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    expose:
      - "9090"

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    restart: unless-stopped
    environment:
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:?укажите ALERT_TELEGRAM_CHAT_ID}
    # Окружение в конфигурацию Alertmanager не разворачивает, поэтому номер
    # чата подставляется здесь. Пустая переменная валит запуск намеренно:
    # тревога, уходящая в никуда, хуже отсутствия тревог — она создаёт
    # уверенность, что за ячейкой смотрят.
    # Своя точка входа: у образа она /bin/alertmanager, и команда уехала бы
    # ему аргументами — «unexpected /bin/sh».
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        sed "s/CHAT_ID_ПОДСТАВЛЯЕТСЯ/$$ALERT_TELEGRAM_CHAT_ID/"
        /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Токен бота отдельным файлом, а не переменной: в переменной он виден
      # в `docker inspect` любому, кто дошёл до хоста.
      - ${ALERT_TELEGRAM_TOKEN_FILE:?укажите ALERT_TELEGRAM_TOKEN_FILE}:/etc/alertmanager/telegram-token:ro
      - amdata:/alertmanager
    expose:
      - "9093"

  # Отметки о бэкапе. Бэкап — задача по расписанию, между запусками процесса
  # нет, и опрашивать нечего: он сам кладёт сюда время последнего успеха,
  # а Prometheus читает это отсюда.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    command:
      # Иначе отметка исчезает при перезапуске контейнера, и тревога
      # «бэкап не снимался» приходит на ровном месте.
      - --persistence.file=/data/pushgateway.store
    volumes:
      - pushdata:/data
    # На петлю, а не наружу: бэкап запускается на хосте по cron, а не
    # в контейнере, и дотянуться до отметки ему больше неоткуда. С других
    # машин порт при этом закрыт — 127.0.0.1 в привязке не украшение.
    #
    # Номер настраиваемый: в бою ячейки живут на разных машинах и делить
    # порт им не с кем, а на одной машине (прогон, разбор аварии) две ячейки
    # с фиксированным номером просто не поднимутся.
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"

volumes:
  pgdata:
  kafkadata:
  miniodata:
  caddydata:
  caddyconfig:
  promdata:
  amdata:
  pushdata:
