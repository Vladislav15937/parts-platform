# Развёртывание ячейки.
#
# Одна ячейка — это комплект Postgres + S3 на группу арендаторов (до ~200).
# Отдельный кластер на клиента не делаем: при пятистах клиентах это
# 12–22 млн ₽/мес против 150–450 ₽ на арендатора в ячейке.
#
#   cp .env.example .env   # заполнить секреты, домены и APP_IMAGE_TAG
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Ячейка НИЧЕГО не собирает. Образ приложения собран один раз в CI и лежит
# в реестре с тегом по SHA коммита — выкладка его только забирает. Поэтому
# рядом с этим файлом не нужны ни исходники, ни Dockerfile, ни JDK с node.
# Пока прод собирал себя сам (`up -d --build` на боевой машине), в бою
# работал артефакт, которого не видел никто: тот же Dockerfile, но другая
# сборка — другая сеть, другой кэш npm, другая минута.
#
# Что рядом всё-таки нужно: каталог `ops/` с настройками — их монтируют
# терминатор, Postgres, Prometheus и alertmanager (шесть файлов ниже —
# шестой, ops/active-build.caddy, появился с переключением сборок).
# Это настройки, а не сборка, и отсутствуют они не молча: docker создаёт
# на месте пропавшего файла пустой каталог, и, например, у Postgres
# архивирование WAL начинает падать с кодом 126 при работающей базе.
#
# Новая версия — НЕ «сменить тег и перезапустить»: так между остановкой
# старой сборки и подъёмом новой людей не обслуживает никто, а неудачная
# версия оставляет ячейку лежать. Сборок две, синяя и зелёная, и старая
# гаснет последней:
#
#   COMPOSE_PROFILES=blue,green APP_IMAGE_TAG_GREEN=<новый SHA> \
#       docker compose -f docker-compose.prod.yml up -d app-green
#   ops/switch-build.sh green          # ждёт готовности и переводит трафик
#   docker compose -f docker-compose.prod.yml stop app-blue
#
# Откат — `ops/switch-build.sh blue`, пока синяя ещё жива: секунды и без
# выкачивания образа. Позже — прежний тег, образ из реестра никуда не делся.
# Полный порядок и что делать с .env после — docs/deployment.md,
# «Переключение трафика: синяя и зелёная сборки».
#
# Какие сборки должны работать, говорит COMPOSE_PROFILES (в .env): в покое
# одна, на время выкладки обе. Без этой строки поднимается синяя — прежняя
# версия, как было (задача 0110): ячейка, обновлённая по инструкции, которая
# о переменной не знала, иначе не поднимала ни одной сборки вовсе. Какая
# из них ПОД ТРАФИКОМ — записано в ops/active-build.caddy, и это единственное
# место, где стоит её имя.
#
# Наружу смотрит только терминатор: 80 и 443. Приложение и хранилище портов
# на хосте не занимают — до них можно дойти лишь через него.
#
# Kafka по умолчанию выключена: профиль по умолчанию работает на транспорте
# в памяти, и первым клиентам этого достаточно. Брокер нужен, когда экземпляров
# приложения становится больше одного — при in-memory транспорте событие
# обрабатывается там же, где родилось, и второй экземпляр про него не узнает.
#
# Перекрытие сборок при выкладке этому не противоречит, и вот почему:
# событие берёт из outbox та сборка, которая успела его заявить
# (`claimed_at`), обработчики у обеих одни и те же, а дубль отбивает вставка
# в processed_event. То есть событие обрабатывается ровно один раз — просто
# неизвестно, какой из двух сборок. Окно это минуты, и постоянно двух
# экземпляров без брокера у нас не бывает.
#
# Включается своим профилем compose, вместе с профилем Spring:
#
#   SPRING_PROFILES=kafka docker compose -f docker-compose.prod.yml \
#       --profile kafka up -d
#
# Порядок при включении: сначала поднять брокер, потом переключить приложение.
# Наоборот — приложение секунду за секундой не может отправить накопленное,
# и релей крутится вхолостую до появления Kafka. Событий он при этом
# не теряет: неопубликованное лежит в outbox, пока не уедет.

# Имя проекта включает имя ячейки, и это не косметика: имя проекта задаёт
# имена томов. Две ячейки с одним именем делят базу и хранилище — то есть
# перестают быть двумя ячейками, а обнаруживается это по чужим клиентам
# в реестре.
#
# И оно своё, а не унаследованное от каталога: иначе тома совпадают с теми,
# что поднимает docker-compose.yml для разработки, а Postgres инициализирует
# пользователя только на пустом каталоге данных. Боевая ячейка тогда либо
# молча поднимается на базе с dev-паролем, либо не поднимается вовсе
# с «password authentication failed», и причина не видна ни в одном логе.
name: partsflow-${APP_CELL:-cell01}

# «Тег образа задан» проверяется здесь, а не в image: сервиса, и это не каприз.
# У каждой сборки свой тег (APP_IMAGE_TAG_BLUE / APP_IMAGE_TAG_GREEN), общий
# APP_IMAGE_TAG — их умолчание; а `${A:-${B:?…}}` compose разбирает жадно:
# внутреннее «обязательно» срабатывает даже тогда, когда A задан, то есть
# отказ приходил бы на верной настройке. Проверено попыткой.
#
# Поле расширения интерполируется на общих основаниях, поэтому сообщение
# из задачи 0074 сохранено дословно: подставленный latest означал бы
# «неизвестно что» ровно в тот день, когда надо назвать, какая версия
# работает у клиента.
x-app-image-tag-required: ${APP_IMAGE_TAG:?укажите APP_IMAGE_TAG — SHA коммита, собранного CI}

# Общая часть обеих сборок. Синяя и зелёная обязаны отличаться ровно двумя
# вещами — именем и тегом образа: разойдись у них окружение, «переключились
# на новую» означало бы ещё и «поменяли настройки», и разбирать неудачную
# выкладку пришлось бы по двум причинам сразу.
#
# Ключа image: здесь нет намеренно (см. выше про жадную интерполяцию), а имя
# сервиса в якорь не вынести — оно и есть то, чем сборки различаются.
x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started
  # Окружение обеих сборок, КРОМЕ адреса базы: он у каждой сборки свой
  # и дописывается в самом сервисе (см. app-blue ниже). Якорь отдельный,
  # потому что слияние YAML неглубокое — сервис, назвавший environment,
  # заменил бы его целиком.
  environment: &app-env
    # Рабочее подключение. Если заведена отдельная роль (ops/create-roles.sh),
    # приложение работает ею — и тогда журналы движений, изменений и лицевых
    # счетов ему не принадлежат: переписать их прямым SQL нельзя. Без роли
    # всё идёт владельцем, как раньше.
    DB_USER: ${APP_RUNTIME_ROLE:-${DB_USER:?укажите DB_USER}}
    DB_PASSWORD: ${APP_RUNTIME_PASSWORD:-${DB_PASSWORD:?укажите DB_PASSWORD}}

    # Подключение владельца схем: миграции, провижининг, выдача прав.
    # Пустой APP_DDL_URL означает «отдельной роли нет» — тогда DDL идёт
    # рабочей ролью. Сам адрес дописывается в сервисе: база у сборки своя.
    APP_DDL_USERNAME: ${APP_DDL_USERNAME:-}
    APP_DDL_PASSWORD: ${APP_DDL_PASSWORD:-}

    # Кому выдавать права на схемы арендаторов. Пусто — разделения нет.
    APP_RUNTIME_ROLE: ${APP_RUNTIME_ROLE:-}

    # Секрет создания арендаторов. Пустой выключает механизм — так и надо
    # держать между подключениями клиентов.
    APP_PROVISIONING_TOKEN: ${APP_PROVISIONING_TOKEN:-}

    # Ключ шифрования секретов площадок, 32 байта в base64.
    # Потеряете — ключи кабинетов не расшифруются, и их придётся
    # запрашивать у площадок заново. Держите копию отдельно от бэкапа базы:
    # вместе они дают то же, что и открытый текст.
    APP_CRYPTO_KEY: ${APP_CRYPTO_KEY:?укажите APP_CRYPTO_KEY}

    # Транспорт событий. Пусто — профиль по умолчанию, транспорт в памяти.
    # Значение kafka включает KafkaEventTransport и слушателя; поднимать
    # брокер надо профилем compose (см. шапку файла).
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES:-}
    KAFKA_SERVERS: kafka:9092

    # Адрес приложения снаружи. Из него строятся постоянные ссылки
    # на снимки в прайсе площадки: адрес из запроса за терминатором —
    # это имя сборки во внутренней сети, и площадка по такой ссылке
    # не сходит никуда.
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?укажите PUBLIC_ORIGIN}

    S3_ENDPOINT: http://minio:9000
    # Внешнее имя: хост входит в подпись, и ссылка, подписанная внутренним
    # адресом, с телефона приёмщика не откроется.
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?укажите S3_PUBLIC_ENDPOINT}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?укажите S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?укажите S3_SECRET_KEY}

    # Приложение стоит за терминатором и без этого считает запрос
    # незашифрованным: cookie сессии уйдёт без флага Secure, то есть
    # утечёт в первый же http-запрос к тому же домену.
    #
    # Именно native: с framework Secure получает только CSRF-cookie —
    # см. комментарий в application.yml.
    #
    # Доверять этим заголовкам можно ровно потому, что порт приложения
    # наружу не выставлен: подделать X-Forwarded-Proto может лишь тот,
    # кто уже внутри сети docker.
    FORWARD_HEADERS: native

    # Имя ячейки — префикс топиков Kafka и метка на тревогах.
    APP_CELL: ${APP_CELL:-cell01}
    # Номер ячейки — старший разряд номера арендатора. У второй ячейки
    # клиенты начинаются с 2 000 001, и дамп из неё разворачивается
    # в соседнюю без переименования схем.
    APP_CELL_NUMBER: ${APP_CELL_NUMBER:-1}

    LOG_LEVEL: INFO
  # Порт наружу не публикуется намеренно: единственный вход — терминатор.
  # Открытый 8080 сводит на нет и сертификат, и ограничение по адресам.
  expose:
    - "8080"

  # Предел памяти контейнера, а не -Xmx в аргументах: образ уже считает кучу
  # от предела контейнера (-XX:MaxRAMPercentage=70), и без предела JVM видит
  # всю машину. На ячейке в 12 ГБ это 8,4 ГБ кучи на экземпляр — а во время
  # выкладки экземпляров ДВА, рядом с Postgres, MinIO и тремя контейнерами
  # наблюдения. Ставить -Xmx вторым способом нельзя: два способа посчитать
  # одно и то же разъезжаются молча.
  #
  # 2 ГБ — замер, а не прикидка (13 сентября 2026, живой прогон ячейки
  # на этом compose): куча в работе 92–140 МБ, RSS контейнера 420–540 МБ
  # на экземпляр, две сборки рядом дали 1,05 ГБ на двоих. Предел взят
  # с четырёхкратным запасом: в нём должны уместиться и переезд клиента
  # (пачки по 200 снимков), и выгрузка прайса на 35 тысяч позиций.
  # Меньше ставить нельзя, больше — незачем: на 12 ГБ две сборки по 2 ГБ
  # оставляют базе и хранилищу 8.
  mem_limit: ${APP_MEM_LIMIT:-2g}

  # Готов ли обслуживать — а не «отвечает ли порт».
  #
  # Порядок выкладки владельца: миграция, база, «само приложение встало
  # штатно», и только тогда гасить старую сборку. Третий шаг машинно
  # не проверялся ничем: приложение отвечает на порту раньше, чем пригодно
  # к работе, и все три состояния «поднялся, но работать нельзя» здесь уже
  # случались — отставшие схемы (площадка забрала пустой прайс), запуск
  # владельцем схем (журналы снова изменяемы), метрики, которые некому
  # отдавать. Шаг выкладки ждёт именно этой отметки и краснеет по таймауту.
  #
  # Это строже, чем HEALTHCHECK самого образа: тот спрашивает
  # /actuator/health — контекст и база, то есть живость. Разделение
  # намеренное, см. ReadinessEndpoint: мягкая проверка обязана быть зелёной
  # в разработке, где одна роль законна и схема отстаёт между накатами.
  #
  # wget, а не curl: в образе приложения (alpine + busybox) есть первый.
  # На 503 он завершается с ошибкой, и grep не получает ничего — то есть
  # контейнер становится unhealthy и по коду ответа, и по телу.
  #
  # Нездоровый контейнер docker не гасит и не перезапускает (restart
  # смотрит на выход процесса, а не на healthcheck) — отметка нужна
  # выкладке и `docker compose ps`, а не автолечению.
  healthcheck:
    test: ["CMD-SHELL",
           "wget -qO- http://localhost:8080/actuator/readiness | grep -q '\"ready\":true'"]
    interval: 15s
    timeout: 5s
    # Старт с накатом общей схемы и подъёмом контекста — десятки секунд
    # на живой ячейке; до конца этого срока неудачные попытки не считаются
    # отказом, иначе выкладка увидит красное там, где приложение ещё встаёт.
    start_period: 120s
    retries: 5

services:
  # Терминатор: сертификаты, шифрование и ограничение управляющего контура.
  #
  # Без него не работает приёмка: камера в браузере доступна только
  # в защищённом контексте. По http нет ни съёмки деталей, ни сканирования
  # ячеек и VIN — то есть нет половины продукта, а не «нет замочка в адресе».
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Зависимости от сборок здесь нет намеренно, и это не мелочь: обе
    # сборки стоят под профилями, а depends_on на сервис с профилем
    # включает этот профиль сам — то есть compose поднимал бы обе всегда.
    # Терминатор при неподнятой сборке отвечает 502 и чинится сам, как
    # только она встанет.
    depends_on:
      - minio
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?укажите APP_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN:?укажите S3_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?укажите ACME_EMAIL}
      # Откуда разрешено ходить в /api/provisioning. Умолчание — петля,
      # то есть «только с самой машины через docker compose exec».
      PROVISIONING_ALLOW: ${PROVISIONING_ALLOW:-127.0.0.1/32}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # Имя активной сборки — отдельным файлом, который Caddyfile
      # импортирует. Так переключение трафика это правка одной строки
      # плюс `caddy reload`: конфигурация перечитывается в том же
      # процессе, а контейнер не трогается вовсе — он держит
      # сертификаты. Переписывает файл ops/switch-build.sh (на месте,
      # а не переименованием: у bind-mount'а одного файла подменённый
      # inode контейнер уже не увидит).
      - ./ops/active-build.caddy:/etc/caddy/active-build.caddy:ro
      # Сертификаты переживают пересоздание контейнера. Без этого тома каждый
      # перезапуск — новый выпуск, а у Let's Encrypt на это недельный предел:
      # упрёшься в него в худший момент, во время разбора аварии.
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"

  # Две сборки под одним доменом: синяя и зелёная. Выкладка поднимает вторую
  # РЯДОМ с работающей, ждёт её готовности и только потом переводит на неё
  # трафик (ops/switch-build.sh) — старая гаснет последней, и возврат при
  # неудаче мгновенный, потому что она ещё работает.
  #
  # Отличаются ровно двумя вещами: именем сервиса и тегом образа. Всё
  # остальное — из якоря x-app выше.
  #
  # У каждой свой профиль, и это не украшение: без профилей `up -d` поднимал
  # бы обе всегда — то есть погашенная старая сборка воскресала бы при первой
  # же команде, унося и память, и смысл выкладки. Какие сборки должны
  # работать, говорит COMPOSE_PROFILES в .env: в покое одна («blue»),
  # на время перекрытия обе («blue,green»); без строки — синяя, прежняя
  # (см. пустой профиль у app-blue ниже).
  #
  # Готовый образ из реестра, а не сборка на месте. Тег — SHA коммита,
  # и он обязателен: плавающего умолчания вроде :latest здесь нет
  # намеренно (правило «плавающий тег в прогоне запрещён» — ops/CLAUDE.md),
  # иначе «в бою работает такой-то коммит» перестаёт быть проверяемым
  # фактом. Незаданный тег валит запуск словами (x-app-image-tag-required
  # в шапке), а не поднимает вчерашнее.
  #
  # Ключа build: у сервисов нет тоже намеренно: с ним отсутствующий в реестре
  # образ compose молча собрал бы из того, что лежит рядом, — то есть
  # вернулась бы ровно та болезнь, ради которой правка и делалась,
  # и вернулась бы незаметно.
  #
  # APP_IMAGE переопределяют, когда образ лежит не в GHCR: зеркало
  # в закрытом контуре, локальный реестр в прогоне.
  #
  # APP_IMAGE_TAG_BLUE/GREEN задают на время выкладки — новой сборке свой
  # тег, а общий APP_IMAGE_TAG остаётся версией ячейки. Одного общего тега
  # тут не хватает: `up -d` без имени сервиса пересоздал бы ОБЕ сборки новым
  # образом, то есть погасил бы ту самую старую, ради которой всё затеяно.
  #
  # И третьей — БАЗОЙ (задача 0112). Выкладка снимает с базы работающей
  # сборки копию, накатывает на неё схему и поднимает новую сборку уже на
  # копии: старая до последнего работает на своей нетронутой, а неудача
  # означает удалённую копию, а не опущенную схему. Имя базы каждой сборки
  # записано в .env (APP_DB_BLUE / APP_DB_GREEN) и ведёт его ops/deploy.sh;
  # незаданное — «parts», база, с которой ячейка родилась. Спрашивать имя
  # надо у ops/switch-build.sh --db, а не читать .env глазами: переменная
  # окружения оболочки у compose старше файла, и скрипт учитывает это так же.
  #
  # APP_DDL_URL из .env здесь только признак «владелец схем отдельный»:
  # адрес строится заново на базу сборки. Взятый как есть, он указывал бы
  # владельцу на базу ПРЕЖНЕЙ сборки — миграции и провижининг новой ушли бы
  # мимо её копии.
  app-blue:
    <<: *app
    image: ${APP_IMAGE:-ghcr.io/vladislav15937/parts-platform}:${APP_IMAGE_TAG_BLUE:-$APP_IMAGE_TAG}
    # Пустая строка вторым профилем — это «сборка по умолчанию», и стоит она
    # здесь ради ячейки, которую обновляют по инструкции, написанной до 0079.
    # В её .env строки COMPOSE_PROFILES нет, и `up -d` не поднимал НИ ОДНОЙ
    # сборки: терминатор встаёт, за ним 502 всем, а узнаёт об этом
    # выкладывающий в ту минуту, когда приложение уже погашено. Решение
    # владельца от 18 сентября 2026: нет строки про сборки — поднимать
    # прежнюю версию, как было.
    #
    # Механика: при незаданном (и при пустом) COMPOSE_PROFILES набор активных
    # профилей у compose равен [""], и попадает в него только тот, кто эту
    # пустую строку назвал. Названный профиль («green») её не включает — то
    # есть погашенная синяя первым же `up -d` не воскресает, ради чего профили
    # и заводились (0079). Замерено на compose v2.29.7 и v5.0.0-desktop.1;
    # обе стороны стережёт ops/builds-guard.sh шагом CI, потому что молчаливое
    # «не поднялось ничего» — это простой живого клиента.
    profiles: [blue, ""]
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_BLUE:-parts}
      APP_DDL_URL: ${APP_DDL_URL:+jdbc:postgresql://postgres:5432/${APP_DB_BLUE:-parts}}

  app-green:
    <<: *app
    image: ${APP_IMAGE:-ghcr.io/vladislav15937/parts-platform}:${APP_IMAGE_TAG_GREEN:-$APP_IMAGE_TAG}
    profiles: [green]
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_GREEN:-parts}
      APP_DDL_URL: ${APP_DDL_URL:+jdbc:postgresql://postgres:5432/${APP_DB_GREEN:-parts}}

  # Брокер. Поднимается только с профилем kafka — без него приложение
  # работает на транспорте в памяти, и лишний контейнер означал бы лишний
  # источник отказов при одном экземпляре приложения.
  #
  # depends_on у приложения на него нет намеренно: compose включил бы этот
  # профиль сам, и брокер поднимался бы всегда. Отсутствие брокера приложение
  # переживает — неотправленное лежит в outbox.
  kafka:
    # Образ официальный apache/kafka, а не bitnami: последние удалены
    # из реестра после смены политики Bitnami, и `docker compose up`
    # переставал работать целиком, включая postgres. Ровно та же причина,
    # что и в docker-compose.yml для разработки.
    image: apache/kafka:3.8.1
    restart: unless-stopped
    profiles: [kafka]
    environment:
      # KRaft: без ZooKeeper. Один узел — это ячейка, а не кластер на всех.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Имя, по которому брокер зовут изнутри сети docker. Приложение ходит
      # в него по имени сервиса, снаружи в брокер не ходит никто.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Топик заводится на каждый тип события, а перечислять их в конфигурации
      # значит править её при каждом новом — слушатель подписан шаблоном.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # На одном узле реплика может быть только одна: значения по умолчанию
      # не дадут создать ни одного служебного топика. Появится второй узел —
      # поднимать до 3 и 2, иначе пара acks=all с min.insync.replicas
      # у продюсера не защищает ни от чего.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    # Наружу не выставляется: в брокер ходит только приложение.
    expose:
      - "9092"

  # Каталог архива WAL готовится отдельным разовым контейнером, и это
  # не украшение. Каталог монтируется с хоста, docker создаёт отсутствующий
  # от root, а archive_command выполняется пользователем postgres (uid 70):
  # без подготовки архиватор получает «permission denied» на каждый сегмент.
  # Молча это не проходит — неархивированный WAL накапливается в pg_wal
  # и рано или поздно останавливает базу, — но узнать об этом в день, когда
  # понадобилась точка возврата, значит потерять её.
  #
  # service_completed_successfully у postgres ниже: без права записи в архив
  # базу лучше не поднимать вовсе.
  wal-archive-init:
    image: postgres:16-alpine
    user: root
    volumes:
      - ${WAL_ARCHIVE_DIR:-${BACKUP_DIR:-./backups/${APP_CELL:-cell01}}/wal}:/wal-archive
    command:
      - sh
      - -c
      - mkdir -p /wal-archive && chown postgres:postgres /wal-archive && chmod 750 /wal-archive
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      wal-archive-init:
        condition: service_completed_successfully
    # Разделяемая память под параллельные планы. Умолчание Docker — 64 МБ,
    # и на ячейке в 500 арендаторов этого не хватает: обход системного
    # каталога идёт параллельными воркерами, и pg_dump всей базы падает
    # с «could not resize shared memory segment: No space left on device».
    # Проверено на пробе: 22 582 таблицы, 93 713 индексов.
    shm_size: 1gb
    # Настройки под ячейку на сотни арендаторов. Схема-на-арендатора — это
    # десятки тысяч таблиц: при 500 клиентах их 22 582, а с индексами 116 295.
    # Транзакция, трогающая всю базу (pg_dump ячейки целиком, VACUUM FULL),
    # берёт блокировку на каждый объект, и умолчания в 64 не хватает:
    # «out of shared memory: увеличьте max_locks_per_transaction». Проверено —
    # при 64 полный дамп падает, при 512 снимается за 51 секунду.
    #
    # Дамп по одному арендатору (ops/backup.sh) работал и без этого: он берёт
    # блокировки только своей схемы. Ломается ровно то, чем восстанавливают
    # ячейку целиком после потери диска.
    #
    # Архивация WAL — вторая половина бэкапа, и без неё точка возврата равна
    # последнему ночному дампу: отказ в 18:00 стоил бы клиенту смены —
    # принятых деталей, проданных позиций, принятых денег. Дампы по схемам
    # при этом остаются: они возвращают ОДНОГО клиента, не трогая остальных
    # (задача 0083), а архив WAL догоняет любой из них до минуты перед
    # поломкой. Механизма два, и заменить один другим нельзя.
    #
    # Список, а не строка: archive_command содержит и пробелы, и `&&`,
    # и разбор строки compose однажды разложит её не по тем аргументам.
    # Сама команда — отдельный скрипт (ops/archive-wal.sh): ей нужны
    # атомарность, сжатие и честный ответ на повтор, а это не одна строка.
    #
    # archive_timeout=300 — предел того, что теряется при гибели диска
    # вместе с незакрытым сегментом: без него спокойная ячейка может
    # не закрыть сегмент часами, и «точка возврата до минуты» превратится
    # в «до утра». Плата — файл каждые пять минут, и он почти пустой;
    # поэтому архив сжимается (см. скрипт).
    command:
      - postgres
      - -c
      - max_locks_per_transaction=512
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
      - -c
      - archive_timeout=300
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: ${DB_USER:?укажите DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?укажите DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Архив рядом с дампами, а не в томе базы: том умирает вместе с диском
      # ячейки, а офсайт-шаг ops/backup.sh увозит наружу весь каталог бэкапов
      # целиком — то есть архив уезжает вместе с дампами, без отдельной
      # настройки. Путь совпадает с тем, что считают скрипты ops/: разойдясь,
      # они начнут чистить и проверять не тот каталог, в который пишет база.
      - ${WAL_ARCHIVE_DIR:-${BACKUP_DIR:-./backups/${APP_CELL:-cell01}}/wal}:/wal-archive
      - ./ops/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    healthcheck:
      # «parts» здесь — не рабочая база и не требование, чтобы она была:
      # pg_isready спрашивает, принимает ли сервер соединения, и имя базы
      # не проверяет. С задачи 0112 рабочая база называется по выкладке,
      # а «parts» после второй выкладки копией удалена — и это нормально.
      # Менять строку нельзя без причины: правка конфигурации postgres
      # пересоздаёт его контейнер при подъёме новой сборки (up -d app-…
      # сводит и зависимости), то есть перезапускает базу посреди выкладки.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d parts"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Наружу не выставляется: к базе ходит только приложение. Для бэкапа
    # и разбора — docker compose exec, а не открытый в интернет 5432.

  # Версия закреплена и образ взят с quay.io — почему, расписано
  # в docker-compose.yml. Коротко: minio/minio с Docker Hub убран, а плавающий
  # тег меняется под ногами. Версия здесь и в разработке обязана совпадать.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?укажите S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?укажите S3_SECRET_KEY}
      # Телефон грузит снимок прямо в хранилище по подписанной ссылке,
      # то есть из браузера и с другого источника. Без CORS браузер отбивает
      # запрос ещё до отправки, а приложению это выглядит как обрыв связи.
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_ORIGIN:?укажите PUBLIC_ORIGIN}
    volumes:
      - miniodata:/data
    # Хранилище доступно телефону напрямую — файл идёт мимо приложения
    # намеренно, — но через терминатор: подписанная ссылка ведёт на https,
    # а по http браузер её и не отправит со страницы приложения.
    expose:
      - "9000"

  # Клиент хранилища для бэкапа и восстановления фотографий.
  #
  # Отдельным сервисом, а не `docker run`: так он в той же сети, что и minio,
  # и ходит к нему по имени, не открывая порт наружу. Профиль `backup` держит
  # его выключенным — он запускается разово, из ops/backup.sh:
  #
  #   docker compose -f docker-compose.prod.yml run --rm -v /путь:/backup mc mirror …
  #
  # Каталог бэкапов монтируется флагом при запуске, а не здесь: его путь знает
  # только скрипт, из файла окружения, и повторять здесь тот же расчёт значит
  # однажды разойтись с ним и писать копию не туда.
  mc:
    # quay.io по той же причине, что и у minio выше: тег был закреплён
    # с самого начала, но забирался с Docker Hub, откуда MinIO ушёл, — то есть
    # бэкап фотографий сейчас не поднялся бы вовсе. Версия та же.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [backup]
    environment:
      # mc читает MC_HOST_<псевдоним> из окружения. Так ключи не попадают
      # ни в аргументы команды, ни в историю оболочки, ни в `docker ps`.
      MC_HOST_cell: http://${S3_ACCESS_KEY:?укажите S3_ACCESS_KEY}:${S3_SECRET_KEY:?укажите S3_SECRET_KEY}@minio:9000
    entrypoint: ["mc"]
    command: ["--version"]

  # Наблюдение. Три маленьких контейнера, и все три обязательны, а не
  # «на будущее»: без сборщика метрики просто отдаются в пустоту, а без
  # адресата тревога никуда не уходит — то есть об остановившемся релее
  # оператор узнаёт от клиента.
  #
  # Наружу ни один порт не выставлен. Смотреть их снаружи незачем: правила
  # лежат в репозитории, а состояние приходит в Telegram.
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    # Зависимости от сборок нет по той же причине, что у терминатора: они
    # под профилями, и depends_on поднимал бы обе всегда. Цели сборщик ищет
    # сам, по именам сборок в DNS сети compose (ops/prometheus.yml).
    # Своя точка входа по той же причине, что и у alertmanager: имя ячейки
    # надо подставить в конфигурацию, а окружение Prometheus в ней
    # не разворачивает. Без метки тревога «Релей встал» не говорит, в какой
    # из двух ячеек он встал, — то есть не говорит ничего.
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        sed "s/ЯЧЕЙКА_ПОДСТАВЛЯЕТСЯ/$$APP_CELL/"
        /etc/prometheus/prometheus.yml > /tmp/prometheus.yml &&
        exec /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.retention.time=14d
        --web.enable-lifecycle
    environment:
      APP_CELL: ${APP_CELL:-cell01}
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    expose:
      - "9090"

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    restart: unless-stopped
    environment:
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:?укажите ALERT_TELEGRAM_CHAT_ID}
    # Окружение в конфигурацию Alertmanager не разворачивает, поэтому номер
    # чата подставляется здесь. Пустая переменная валит запуск намеренно:
    # тревога, уходящая в никуда, хуже отсутствия тревог — она создаёт
    # уверенность, что за ячейкой смотрят.
    # Своя точка входа: у образа она /bin/alertmanager, и команда уехала бы
    # ему аргументами — «unexpected /bin/sh».
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        sed "s/CHAT_ID_ПОДСТАВЛЯЕТСЯ/$$ALERT_TELEGRAM_CHAT_ID/"
        /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Токен бота отдельным файлом, а не переменной: в переменной он виден
      # в `docker inspect` любому, кто дошёл до хоста.
      - ${ALERT_TELEGRAM_TOKEN_FILE:?укажите ALERT_TELEGRAM_TOKEN_FILE}:/etc/alertmanager/telegram-token:ro
      - amdata:/alertmanager
    expose:
      - "9093"

  # Отметки о бэкапе. Бэкап — задача по расписанию, между запусками процесса
  # нет, и опрашивать нечего: он сам кладёт сюда время последнего успеха,
  # а Prometheus читает это отсюда.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    command:
      # Иначе отметка исчезает при перезапуске контейнера, и тревога
      # «бэкап не снимался» приходит на ровном месте.
      - --persistence.file=/data/pushgateway.store
    volumes:
      - pushdata:/data
    # На петлю, а не наружу: бэкап запускается на хосте по cron, а не
    # в контейнере, и дотянуться до отметки ему больше неоткуда. С других
    # машин порт при этом закрыт — 127.0.0.1 в привязке не украшение.
    #
    # Номер настраиваемый: в бою ячейки живут на разных машинах и делить
    # порт им не с кем, а на одной машине (прогон, разбор аварии) две ячейки
    # с фиксированным номером просто не поднимутся.
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"

volumes:
  pgdata:
  kafkadata:
  miniodata:
  caddydata:
  caddyconfig:
  promdata:
  amdata:
  pushdata:
