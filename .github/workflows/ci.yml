name: CI

# Четыре проверки идут независимо и параллельно: миграции, бэкенд, фронтенд,
# развёртывание. Одной задачей было бы проще, но тогда упавший фронтенд прячет
# результат бэкенда, а чаще всего нужно знать именно «что именно сломалось».
on:
  push:
    branches: ['**']
  pull_request:
  # Ручной запуск: пригождается, когда падение подозревают в самом окружении,
  # а не в коде.
  workflow_dispatch:

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон: ждать результата
  # по коду, который уже переписан, незачем.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Целостность changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Вся история и ссылка на main: проверка неизменяемости сравнивает
      # ветку с точкой расхождения, а на мелкой копии сравнивать не с чем.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ссылка на main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Отдельной задачей, а не шагом перед verify.sh: та накатывает набор
      # на чистую базу и отвечает на вопрос «встаёт ли он с нуля», а эта —
      # на вопрос «что случится у клиента, накатанного вчера». Слитые в одну,
      # они прячут друг друга: упавшая статика не даст запуститься накату.
      #
      # Ловит то, чего не видно на чистой базе и что появляется ровно тогда,
      # когда над схемой работают в несколько рук: два одинаковых номера,
      # заведённый и не включённый файл, include без файла, повторный
      # идентификатор changeset, переставленный или убранный include и правку
      # уже выпущенного changeset'а. Последнее дороже всего: чек-сумма
      # разъезжается у всех, кто уже накатан, а не у того, кто правил.
      - name: db/check-changelog.py
        run: ./db/check-changelog.py

  migrations:
    name: Миграции на чистой базе
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Чек-суммы Liquibase строгие намеренно: правка уже выполненного
      # changeset ломает деплой. Здесь это ловится на чистой базе, вместе
      # с откатом и повторным накатом.
      - name: db/verify.sh
        run: ./db/verify.sh

  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Маркерные свойства вида app.что-то-test=true не влияют ни на что,
      # кроме ключа кэша контекстов Spring: каждый такой маркер — ещё один
      # поднятый контекст и ещё один пул соединений. На этом уже краснел
      # прогон: «too many clients already», причём падал не тот тест, который
      # виноват, а тот, что запустился последним. Правило держится проверкой,
      # а не памятью.
      - name: Маркерные свойства в тестах
        run: |
          FOUND=$(grep -rn 'properties = "app\.[a-z-]*test' src/test/java || true)
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "Маркерное свойство поднимает лишний контекст Spring с ещё одним пулом."
            echo "Нужен свой контекст — дайте настоящую настройку или @Import с подменой бина."
            exit 1
          fi

      # Тесты поднимают настоящий Postgres через Testcontainers: на mock-объектах
      # ни изоляция арендаторов, ни триггеры остатка не проверяются вовсе.
      # Docker на ubuntu-раннере есть из коробки; версию API не навязываем —
      # PostgresTestBase берёт умолчание, если переменная не задана.
      - name: Тесты
        run: ./mvnw -B -ntp test

      # Отчёты нужны, когда падение не воспроизводится локально: в логе job
      # видно только имя теста, а причина — в surefire-отчёте.
      - name: Отчёты упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия берётся из .nvmrc, чтобы не разъезжаться с локальной.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, а не install: install молча правит package-lock.json, и сборка
      # начинает зависеть от того, когда её запустили.
      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test -- --run

      # build включает tsc --noEmit: строгий режим TypeScript ловит то, что
      # тесты не ловят, — и падать это должно здесь, а не при выкладке.
      - name: Сборка
        run: npm run build

  deployment:
    name: Развёртывание
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Конфигурация терминатора не проверяется ничем остальным: ошибка в ней
      # обнаруживается на выкладке, то есть в момент, когда клиенты уже ждут.
      # Секунды на проверку против часа разбора в бою.
      - name: Конфигурация терминатора
        run: |
          docker run --rm -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e APP_DOMAIN=parts.example.ru \
            -e S3_DOMAIN=s3.example.ru \
            -e ACME_EMAIL=ci@example.ru \
            -e PROVISIONING_ALLOW=10.0.0.0/8 \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # Проверяется не только синтаксис compose, но и полнота .env.example:
      # переменные заполняются заглушками прямо из него, и забытая в примере
      # обязательная переменная валит эту команду. Иначе о ней узнаёт клиент,
      # разворачивающий ячейку по инструкции.
      - name: Боевой compose и полнота .env.example
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f docker-compose.prod.yml --env-file .env config >/dev/null

      # Образ собирается тем же многоступенчатым Dockerfile, что и в бою:
      # фронтенд внутрь jar, jar в JRE. Бэкенд и фронтенд проверены соседними
      # задачами по отдельности, а здесь ловится их сборка вместе — то, что
      # ломается при выкладке и больше нигде.
      - name: Сборка боевого образа
        run: docker build -t partsflow:ci .
