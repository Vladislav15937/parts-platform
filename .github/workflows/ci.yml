name: CI

# Проверки идут независимо и параллельно: changelog, эндпоинты, схемы тестов,
# точка возврата, миграции, откат по шагам, бэкенд, фронтенд, развёртывание.
# Одной задачей было бы проще, но
# тогда упавший фронтенд прячет результат бэкенда, а чаще всего нужно знать
# именно «что именно сломалось».
#
# Последней — и единственной зависимой — идёт публикация образа: она ждёт
# всех остальных, потому что образ, попавший в реестр, уже нельзя «не
# выложить», а неверным его делает любая красная задача.
on:
  push:
    branches: ['**']
  pull_request:
  # Ручной запуск: пригождается, когда падение подозревают в самом окружении,
  # а не в коде.
  workflow_dispatch:

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон: ждать результата
  # по коду, который уже переписан, незачем.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Целостность changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Вся история и ссылка на main: проверка неизменяемости сравнивает
      # ветку с точкой расхождения, а на мелкой копии сравнивать не с чем.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ссылка на main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Отдельной задачей, а не шагом перед verify.sh: та накатывает набор
      # на чистую базу и отвечает на вопрос «встаёт ли он с нуля», а эта —
      # на вопрос «что случится у клиента, накатанного вчера». Слитые в одну,
      # они прячут друг друга: упавшая статика не даст запуститься накату.
      #
      # Ловит то, чего не видно на чистой базе и что появляется ровно тогда,
      # когда над схемой работают в несколько рук: два одинаковых номера,
      # заведённый и не включённый файл, include без файла, повторный
      # идентификатор changeset, переставленный или убранный include и правку
      # уже выпущенного changeset'а. Последнее дороже всего: чек-сумма
      # разъезжается у всех, кто уже накатан, а не у того, кто правил.
      - name: db/check-changelog.py
        run: ./db/check-changelog.py

      # Цена отката. Проверка не умеет определять потерю данных сама —
      # это знает только автор changeset'а, — но умеет требовать, чтобы
      # он её назвал: у отката с DROP TABLE, DROP COLUMN, DELETE или UPDATE
      # обязана стоять строка `--rollback-теряет`. Без неё выкладка узнаёт
      # цену отката от клиента, у которого «позиция 347» стала другой
      # деталью. Здесь же, а не в задаче с Docker: это разбор текста,
      # секунды, и ответ нужен до двадцати минут прогона.
      - name: db/rollback-cost.py --selftest
        run: ./db/rollback-cost.py --selftest

      - name: db/rollback-cost.py
        run: ./db/rollback-cost.py

  endpoints:
    name: Эндпоинты и экраны
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # «Эндпоинт без экрана — это отсутствующая возможность» находилось
      # восемь раз подряд, и каждый раз одинаково: не чтением кода, а попыткой
      # пройти сценарий и упереться в то, что кнопки нет. Написанный и покрытый
      # тестами эндпоинт при этом выглядит работающей возможностью в любом
      # отчёте — поэтому сверка идёт перебором, а не внимательностью.
      - name: tools/endpoint-coverage.py
        run: ./tools/endpoint-coverage.py

  test-schemas:
    name: Схемы арендаторов в тестах
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Вся история и ссылка на main — как у changelog: сторож складывает
      # ветку с origin/main по точке расхождения, и на мелкой копии этой
      # точки нет. Без этих двух строк вторая половина проверки молчит
      # ровно там, где она нужна: локально номер, занятый в main, не виден
      # вовсе, а CI — единственное место, где обе стороны есть сразу.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ссылка на main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # «Схему на два теста не делить» записано в корневом CLAUDE.md и повторено
      # в комментариях самих тестов — и нарушено четырежды за три дня, каждый раз
      # новым способом и каждый раз при зелёном локальном прогоне: поодиночке
      # класс заводит фикстуру сам, сталкиваются они только в общем прогоне.
      # Отдельной задачей, а не шагом бэкенда: ответ нужен за секунды и до того,
      # как двадцать минут тестов покраснеют не тем местом.
      - name: tools/test-schema-guard.py
        run: ./tools/test-schema-guard.py

  worktrees:
    name: Уборка рабочих деревьев
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Инструмент сносит каталоги, и ошибается такой ровно один раз. Его
      # самопроверка заводит настоящий временный репозиторий с настоящими
      # копиями — грязной, слитой, брошенной, свежей — и прогоняет через
      # них и решение, и снятие. Сам по себе он в CI не зовётся (копия там
      # одна), а проверка его правил нужна здесь: без неё сторож, который
      # не снимает чужую невыложенную работу, доживёт до первой правки.
      - name: tools/worktrees-clean.py --самопроверка
        run: ./tools/worktrees-clean.py --самопроверка

  recovery-point:
    name: Точка возврата
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Сторож цепочки WAL — единственное, что отличает «архив есть»
      # от «вернуться можно»: разрыв посередине Postgres переживает молча
      # и поднимается на том, что накатилось. Сторож, не краснеющий на такой
      # дыре, хуже отсутствующего, и установить это можно только попыткой —
      # поэтому он проверяет себя сам, на пяти случаях, и проверка стоит
      # здесь: секунды, без docker и без базы.
      - name: ops/wal-archive.sh --selftest
        run: ./ops/wal-archive.sh --selftest

      # Разбор момента возврата ошибается ТИХО: неправильно понятое время
      # выглядит как правильно понятое, восстановление проходит успешно
      # и возвращает не тот момент. Проверка идёт в поясе Asia/Novosibirsk
      # намеренно — раннер живёт в UTC, и там разница между «местным»
      # и «UTC» равна нулю, то есть именно тот случай, ради которого задача
      # 0087 заведена, на CI не проверялся бы вовсе. Docker и база не нужны.
      - name: ops/restore-pitr.sh --selftest
        run: ./ops/restore-pitr.sh --selftest

      # Правила тревог разбирает Prometheus при загрузке, и ошибка в одном
      # выражении не даёт загрузиться ВСЕМУ файлу — то есть ячейка остаётся
      # без тревог целиком, а узнают об этом сверкой числа правил. Здесь
      # это стоит секунд.
      - name: Правила тревог
        run: |
          docker run --rm -v "$PWD/ops/alerts.yml:/alerts.yml:ro" \
            --entrypoint /bin/promtool prom/prometheus:v2.53.0 \
            check rules /alerts.yml

  migrations:
    name: Миграции на чистой базе
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Чек-суммы Liquibase строгие намеренно: правка уже выполненного
      # changeset ломает деплой. Здесь это ловится на чистой базе, вместе
      # с откатом и повторным накатом.
      - name: db/verify.sh
        run: ./db/verify.sh

  rollback:
    name: Откат по шагам
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Отдельной задачей от «Миграций на чистой базе», и это не дробление
      # ради дробления: та отвечает на вопрос «встаёт ли набор с нуля
      # и сносится ли до пустоты», а эта — на вопрос выкладки «вернётся ли
      # схема ровно к той, на которой работала прежняя сборка». Второе
      # не следует из первого: откат до нуля проходит и при неверном откате
      # отдельного changeset'а — следующий за ним снесёт таблицу целиком
      # и спрячет разницу.
      #
      # Самопроверка идёт первой и на своём маленьком changelog'е: сторож,
      # не краснеющий на дефекте, хуже отсутствующего, и установить это можно
      # только попыткой. Прежняя её редакция ловила подделку отказом SQL,
      # а не сверкой снимков — то есть сверку не проверяла вовсе.
      - name: db/verify-rollback.py --selftest
        run: ./db/verify-rollback.py --selftest

      - name: db/verify-rollback.py
        run: ./db/verify-rollback.py

  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Маркерные свойства вида app.что-то-test=true не влияют ни на что,
      # кроме ключа кэша контекстов Spring: каждый такой маркер — ещё один
      # поднятый контекст и ещё один пул соединений. На этом уже краснел
      # прогон: «too many clients already», причём падал не тот тест, который
      # виноват, а тот, что запустился последним. Правило держится проверкой,
      # а не памятью.
      - name: Маркерные свойства в тестах
        run: |
          FOUND=$(grep -rn 'properties = "app\.[a-z-]*test' src/test/java || true)
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "Маркерное свойство поднимает лишний контекст Spring с ещё одним пулом."
            echo "Нужен свой контекст — дайте настоящую настройку или @Import с подменой бина."
            exit 1
          fi

      # Тесты поднимают настоящий Postgres через Testcontainers: на mock-объектах
      # ни изоляция арендаторов, ни триггеры остатка не проверяются вовсе.
      # Docker на ubuntu-раннере есть из коробки; версию API не навязываем —
      # PostgresTestBase берёт умолчание, если переменная не задана.
      - name: Тесты
        run: ./mvnw -B -ntp test

      # Отчёты нужны, когда падение не воспроизводится локально: в логе job
      # видно только имя теста, а причина — в surefire-отчёте.
      - name: Отчёты упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия берётся из .nvmrc, чтобы не разъезжаться с локальной.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, а не install: install молча правит package-lock.json, и сборка
      # начинает зависеть от того, когда её запустили.
      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test -- --run

      # build включает tsc --noEmit: строгий режим TypeScript ловит то, что
      # тесты не ловят, — и падать это должно здесь, а не при выкладке.
      - name: Сборка
        run: npm run build

  deployment:
    name: Развёртывание
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Конфигурация терминатора не проверяется ничем остальным: ошибка в ней
      # обнаруживается на выкладке, то есть в момент, когда клиенты уже ждут.
      # Секунды на проверку против часа разбора в бою.
      #
      # Файл активной сборки монтируется рядом: Caddyfile его импортирует,
      # и без него разбор падает. Проверяется он тут не «заодно» — это
      # единственное место, где записано, куда идёт трафик ячейки.
      - name: Конфигурация терминатора
        run: |
          docker run --rm -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/ops/active-build.caddy:/etc/caddy/active-build.caddy:ro" \
            -e APP_DOMAIN=parts.example.ru \
            -e S3_DOMAIN=s3.example.ru \
            -e ACME_EMAIL=ci@example.ru \
            -e PROVISIONING_ALLOW=10.0.0.0/8 \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # Переключатель трафика проверяет себя сам: без docker и без ячейки,
      # на разборе файла активной сборки и записи в него. Он единственное,
      # что стоит между «новая сборка не поднялась» и «люди уехали на неё»,
      # а проверка, которая не краснеет на дефекте, хуже отсутствующей.
      - name: ops/switch-build.sh --selftest
        run: ./ops/switch-build.sh --selftest

      # Проверяется не только синтаксис compose, но и полнота .env.example:
      # переменные заполняются заглушками прямо из него, и забытая в примере
      # обязательная переменная валит эту команду. Иначе о ней узнаёт клиент,
      # разворачивающий ячейку по инструкции.
      #
      # Обе сборки называются явно: `config` показывает только сервисы
      # включённых профилей, а сборки стоят под профилями blue и green —
      # без этих флагов зелёная не проверялась бы вовсе.
      - name: Боевой compose и полнота .env.example
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f docker-compose.prod.yml --env-file .env \
            --profile blue --profile green config >/dev/null

      # Образ собирается тем же многоступенчатым Dockerfile, что и в бою:
      # фронтенд внутрь jar, jar в JRE. Бэкенд и фронтенд проверены соседними
      # задачами по отдельности, а здесь ловится их сборка вместе — то, что
      # ломается при выкладке и больше нигде.
      #
      # И собирается ровно один раз за прогон: дальше этот же файл уезжает
      # в реестр задачей «Публикация образа». Пересборка там дала бы второй
      # артефакт из того же Dockerfile — другая сеть, другой кэш npm, —
      # то есть ровно ту разницу, ради устранения которой всё и делалось.
      - name: Сборка боевого образа
        run: docker build -t partsflow:ci .

      # Образ уезжает следующей задаче файлом, а не пересборкой: только так
      # «прошло проверки» и «уехало клиенту» означают один и тот же файл.
      # Живёт он сутки — дольше незачем, опубликованное лежит в реестре.
      - name: Образ файлом
        run: docker save partsflow:ci -o /tmp/partsflow-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/partsflow-image.tar
          retention-days: 1

  publish:
    name: Публикация образа
    # Ждёт ВСЕХ проверок, а не только сборки. Образ в реестре — это уже
    # не черновик: по тегу за ним придут на выкладке, а неверным его делает
    # любая красная задача, не одна лишь «Развёртывание».
    needs:
      - changelog
      - endpoints
      - test-schemas
      - worktrees
      - recovery-point
      - migrations
      # Задачу сюда дописывают вместе с самой задачей: список поимённый,
      # и забытое имя не ломает ни одного прогона — просто красная проверка
      # перестаёт останавливать публикацию. Поймано разбором PR #197:
      # «Откат по шагам» появилась в другой ветке, конфликта при слиянии
      # не возникло, и образ уехал бы в реестр при красном откате.
      - rollback
      - backend
      - frontend
      - deployment
    # Только push. У события pull_request github.sha — это эфемерный коммит
    # слияния, которого нет в истории ни одной ветки: образ, названный таким
    # SHA, ничей, и вернуться к нему по номеру коммита нельзя.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Право писать в GHCR даётся здесь и только здесь: остальным задачам
      # оно не нужно, а токен с лишними правами живёт во всех них сразу.
      packages: write
    steps:
      - name: Имя образа
        id: image
        # GHCR принимает только строчные буквы, а владелец репозитория
        # написан как написан. Тег — SHA коммита: не latest и не имя ветки,
        # иначе «в бою работает такой-то коммит» перестаёт быть фактом.
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/$REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Вход в реестр
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Этот SHA уже опубликован?
        id: published
        # Повторный прогон того же коммита не обязан класть в реестр второй
        # образ. Сборка не побайтово повторяема (время в jar), поэтому тот же
        # тег получил бы новый digest, а прежний — тот, что уже стоит
        # на стенде, — остался бы висеть без имени. Тег по SHA неизменен
        # по смыслу: опубликованный не трогаем и говорим об этом вслух.
        run: |
          if docker manifest inspect '${{ steps.image.outputs.ref }}' >/dev/null 2>&1; then
            echo "Уже в реестре: ${{ steps.image.outputs.ref }} — публикация пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.published.outputs.skip == 'false'
        with:
          name: app-image
          path: /tmp

      - name: Публикация
        if: steps.published.outputs.skip == 'false'
        run: |
          docker load -i /tmp/partsflow-image.tar
          docker tag partsflow:ci '${{ steps.image.outputs.ref }}'
          docker push '${{ steps.image.outputs.ref }}'

      - name: Чем выкладывать
        # Последняя строка вывода — то, что оператор переносит в .env ячейки.
        # Без неё SHA пришлось бы выковыривать из адресной строки браузера.
        run: |
          echo "Образ: ${{ steps.image.outputs.ref }}"
          echo "Digest: $(docker manifest inspect -v '${{ steps.image.outputs.ref }}' \
            | jq -r 'if type == "array" then .[0] else . end | .Descriptor.digest')"
          echo "Выкладка ячейки: APP_IMAGE_TAG=${{ github.sha }}"
