name: CI

# Проверки идут независимо и параллельно: changelog, совместимость миграций
# с прежним кодом, эндпоинты, схемы тестов, точка возврата, миграции, откат
# по шагам, бэкенд, фронтенд, развёртывание.
# Одной задачей было бы проще, но
# тогда упавший фронтенд прячет результат бэкенда, а чаще всего нужно знать
# именно «что именно сломалось».
#
# Последней — и единственной зависимой — идёт публикация образа: она ждёт
# всех остальных, потому что образ, попавший в реестр, уже нельзя «не
# выложить», а неверным его делает любая красная задача.
on:
  push:
    branches: ['**']
  pull_request:
  # Ручной запуск: пригождается, когда падение подозревают в самом окружении,
  # а не в коде.
  workflow_dispatch:

concurrency:
  # Новый пуш в ту же ветку отменяет предыдущий прогон: ждать результата
  # по коду, который уже переписан, незачем.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Целостность changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Вся история и ссылка на main: проверка неизменяемости сравнивает
      # ветку с точкой расхождения, а на мелкой копии сравнивать не с чем.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ссылка на main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Отдельной задачей, а не шагом перед verify.sh: та накатывает набор
      # на чистую базу и отвечает на вопрос «встаёт ли он с нуля», а эта —
      # на вопрос «что случится у клиента, накатанного вчера». Слитые в одну,
      # они прячут друг друга: упавшая статика не даст запуститься накату.
      #
      # Ловит то, чего не видно на чистой базе и что появляется ровно тогда,
      # когда над схемой работают в несколько рук: два одинаковых номера,
      # заведённый и не включённый файл, include без файла, повторный
      # идентификатор changeset, переставленный или убранный include и правку
      # уже выпущенного changeset'а. Последнее дороже всего: чек-сумма
      # разъезжается у всех, кто уже накатан, а не у того, кто правил.
      - name: db/check-changelog.py
        run: ./db/check-changelog.py

      # Цена отката. Проверка не умеет определять потерю данных сама —
      # это знает только автор changeset'а, — но умеет требовать, чтобы
      # он её назвал: у отката с DROP TABLE, DROP COLUMN, DELETE или UPDATE
      # обязана стоять строка `--rollback-теряет`. Без неё выкладка узнаёт
      # цену отката от клиента, у которого «позиция 347» стала другой
      # деталью. Здесь же, а не в задаче с Docker: это разбор текста,
      # секунды, и ответ нужен до двадцати минут прогона.
      - name: db/rollback-cost.py --selftest
        run: ./db/rollback-cost.py --selftest

      - name: db/rollback-cost.py
        run: ./db/rollback-cost.py

  migration-compat:
    name: Совместимость миграций с прежним кодом
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Вся история и ссылка на main — как у changelog. Сторож отличает
      # невыпущенные changeset'ы от выпущенных по точке расхождения (объект,
      # заведённый в невыпущенном, прежнему коду неизвестен, и трогать его
      # можно), а релиз из пометки «--сужение» обязан уже быть в main.
      # На мелкой копии нет ни того, ни другого: сторож не молчит, а судит
      # строже — каждый changeset как отдельный релиз.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ссылка на main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Откатывается только приложение, базу чинят вперёд (решение владельца
      # от 14 сентября 2026, tasks/0112): база может быть новее кода, но
      # не старее. Держится это одним — каждая миграция совместима с кодом
      # прежней версии, — и до задачи 0116 держалось словами. Changeset
      # с DROP COLUMN, обязательной колонкой без умолчания, переименованием
      # или сужением CHECK проходит и накат, и откат по шагам: ломается
      # только прежний образ на новой схеме, то есть в ту минуту, когда
      # к откату и прибегли. Отдельной задачей и за секунды — по той же
      # причине, что и changelog: ответ нужен до двадцати минут прогона.
      #
      # Самопроверка идёт первой: сторож, не краснеющий на DROP COLUMN, хуже
      # отсутствующего, и установить это можно только попыткой.
      - name: tools/migration-compat-guard.py --selftest
        run: ./tools/migration-compat-guard.py --selftest

      - name: tools/migration-compat-guard.py
        run: ./tools/migration-compat-guard.py

  endpoints:
    name: Эндпоинты и экраны
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # «Эндпоинт без экрана — это отсутствующая возможность» находилось
      # восемь раз подряд, и каждый раз одинаково: не чтением кода, а попыткой
      # пройти сценарий и упереться в то, что кнопки нет. Написанный и покрытый
      # тестами эндпоинт при этом выглядит работающей возможностью в любом
      # отчёте — поэтому сверка идёт перебором, а не внимательностью.
      - name: tools/endpoint-coverage.py
        run: ./tools/endpoint-coverage.py

  test-schemas:
    name: Схемы арендаторов в тестах
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Вся история и ссылка на main — как у changelog: сторож складывает
      # ветку с origin/main по точке расхождения, и на мелкой копии этой
      # точки нет. Без этих двух строк вторая половина проверки молчит
      # ровно там, где она нужна: локально номер, занятый в main, не виден
      # вовсе, а CI — единственное место, где обе стороны есть сразу.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ссылка на main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # «Схему на два теста не делить» записано в корневом CLAUDE.md и повторено
      # в комментариях самих тестов — и нарушено четырежды за три дня, каждый раз
      # новым способом и каждый раз при зелёном локальном прогоне: поодиночке
      # класс заводит фикстуру сам, сталкиваются они только в общем прогоне.
      # Отдельной задачей, а не шагом бэкенда: ответ нужен за секунды и до того,
      # как двадцать минут тестов покраснеют не тем местом.
      - name: tools/test-schema-guard.py
        run: ./tools/test-schema-guard.py

  worktrees:
    name: Уборка рабочих деревьев
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Инструмент сносит каталоги, и ошибается такой ровно один раз. Его
      # самопроверка заводит настоящий временный репозиторий с настоящими
      # копиями — грязной, слитой, брошенной, свежей — и прогоняет через
      # них и решение, и снятие. Сам по себе он в CI не зовётся (копия там
      # одна), а проверка его правил нужна здесь: без неё сторож, который
      # не снимает чужую невыложенную работу, доживёт до первой правки.
      - name: tools/worktrees-clean.py --самопроверка
        run: ./tools/worktrees-clean.py --самопроверка

      # Сторож «можно ли начинать» — второй инструмент исполнителя, который
      # в прогоне не зовётся, а врать не имеет права: соврав однажды, он
      # получает то же, что любая ложная тревога, — его начинают обходить,
      # и следующая красная main будет настоящей. Самопроверка гоняет его
      # на ПОДЛОЖЕННОМ списке прогонов: живьём состояние «упавшая выкладка
      # поверх зелёного CI» не поймать — через час она уезжает вниз выдачи,
      # — а проба, зеленеющая оттого, что gh не ответил (на раннере входа
      # в GitHub у него нет), засчитывала бы молчание за работу сторожа.
      # Сеть здесь не нужна вовсе: источник списка подменён, gh не зовётся.
      #
      # Шагом в этой задаче, а не отдельной: секунды, тот же класс (инструмент
      # исполнителя проверяет себя), а новая задача CI потребовала бы правки
      # поимённого списка `needs` у публикации образа.
      - name: tools/can-start.sh --selftest
        run: ./tools/can-start.sh --selftest

  recovery-point:
    name: Точка возврата
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Сторож цепочки WAL — единственное, что отличает «архив есть»
      # от «вернуться можно»: разрыв посередине Postgres переживает молча
      # и поднимается на том, что накатилось. Сторож, не краснеющий на такой
      # дыре, хуже отсутствующего, и установить это можно только попыткой —
      # поэтому он проверяет себя сам, на пяти случаях, и проверка стоит
      # здесь: секунды, без docker и без базы.
      - name: ops/wal-archive.sh --selftest
        run: ./ops/wal-archive.sh --selftest

      # Разбор момента возврата ошибается ТИХО: неправильно понятое время
      # выглядит как правильно понятое, восстановление проходит успешно
      # и возвращает не тот момент. Проверка идёт в поясе Asia/Novosibirsk
      # намеренно — раннер живёт в UTC, и там разница между «местным»
      # и «UTC» равна нулю, то есть именно тот случай, ради которого задача
      # 0087 заведена, на CI не проверялся бы вовсе. Docker и база не нужны.
      - name: ops/restore-pitr.sh --selftest
        run: ./ops/restore-pitr.sh --selftest

      # Правила тревог разбирает Prometheus при загрузке, и ошибка в одном
      # выражении не даёт загрузиться ВСЕМУ файлу — то есть ячейка остаётся
      # без тревог целиком, а узнают об этом сверкой числа правил. Здесь
      # это стоит секунд.
      - name: Правила тревог
        run: |
          docker run --rm -v "$PWD/ops/alerts.yml:/alerts.yml:ro" \
            --entrypoint /bin/promtool prom/prometheus:v2.53.0 \
            check rules /alerts.yml

      # Разбор — ещё не тревога. `check rules` выше говорит, что файл
      # читается, и молчит о том, сработает ли правило; а правило, которое
      # не поднимается на дефекте, — это отсутствующая тревога при полном
      # виде защищённости. Здесь подкладываются ряды: отбитый архиватор
      # будит, исправный молчит, разовый отказ молчит — и прежнее правило
      # по очереди на спокойной ячейке молчит тоже, ради чего новое
      # и появилось (задача 0101). Тот же образ, секунды.
      - name: Тревоги про архив срабатывают на подложенных рядах
        run: |
          docker run --rm -v "$PWD/ops:/ops:ro" -w /ops \
            --entrypoint /bin/promtool prom/prometheus:v2.53.0 \
            test rules alerts.test.yml

  migrations:
    name: Миграции на чистой базе
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Чек-суммы Liquibase строгие намеренно: правка уже выполненного
      # changeset ломает деплой. Здесь это ловится на чистой базе, вместе
      # с откатом и повторным накатом.
      - name: db/verify.sh
        run: ./db/verify.sh

  rollback:
    name: Откат по шагам
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Отдельной задачей от «Миграций на чистой базе», и это не дробление
      # ради дробления: та отвечает на вопрос «встаёт ли набор с нуля
      # и сносится ли до пустоты», а эта — на вопрос выкладки «вернётся ли
      # схема ровно к той, на которой работала прежняя сборка». Второе
      # не следует из первого: откат до нуля проходит и при неверном откате
      # отдельного changeset'а — следующий за ним снесёт таблицу целиком
      # и спрячет разницу.
      #
      # Самопроверка идёт первой и на своём маленьком changelog'е: сторож,
      # не краснеющий на дефекте, хуже отсутствующего, и установить это можно
      # только попыткой. Прежняя её редакция ловила подделку отказом SQL,
      # а не сверкой снимков — то есть сверку не проверяла вовсе.
      - name: db/verify-rollback.py --selftest
        run: ./db/verify-rollback.py --selftest

      - name: db/verify-rollback.py
        run: ./db/verify-rollback.py

  mirror:
    name: Зеркало образов
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Право писать в GHCR — здесь и у публикации образа, больше нигде:
      # токен с лишними правами живёт во всех задачах сразу.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Сторож адреса идёт первым и в этой же задаче: он про то самое
      # значение, которое зеркало кладёт в реестр. Самопроверка перед ним —
      # сторож, не краснеющий на дефекте, хуже отсутствующего.
      - name: Адрес образа записан один раз
        run: |
          ./tools/image-pin-guard.py --selftest
          ./tools/image-pin-guard.py

      - name: tools/mirror-images.sh --selftest
        run: ./tools/mirror-images.sh --selftest

      - name: Вход в реестр
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Обычный прогон ничего не собирает: образ в реестре уже лежит, тег
      # закреплён, содержимое по тегу не меняется. Сборка случается ровно
      # тогда, когда зеркала нет, — то есть чинит саму себя, а не требует
      # человека с записками.
      - name: Зеркало на месте?
        id: have
        run: |
          if ./tools/mirror-images.sh --проверить; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Зеркала нет или оно неполно — собираем из выпуска."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Положить образы в зеркало
        if: steps.have.outputs.skip == 'false'
        run: ./tools/mirror-images.sh --опубликовать

      # Ответ спрашивается у реестра, а не выводится из «пуш прошёл»: нужны
      # обе архитектуры (amd64 — прогон и ячейка, arm64 — разработка)
      # и анонимный доступ, иначе образ придётся тянуть с токеном в трёх
      # местах сразу.
      - name: Что лежит в зеркале
        run: ./tools/mirror-images.sh --проверить

  backend:
    name: Бэкенд
    # Ждёт зеркало: три теста поднимают настоящее хранилище, а образ берут
    # из нашего GHCR. Пока образа нет, тесты не начинаются вовсе — ровно так
    # 26 сентября 2026 покраснела main у всех, и каждый из трёх висел
    # по 420 секунд на повторных попытках выкачать.
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Маркерные свойства вида app.что-то-test=true не влияют ни на что,
      # кроме ключа кэша контекстов Spring: каждый такой маркер — ещё один
      # поднятый контекст и ещё один пул соединений. На этом уже краснел
      # прогон: «too many clients already», причём падал не тот тест, который
      # виноват, а тот, что запустился последним. Правило держится проверкой,
      # а не памятью.
      - name: Маркерные свойства в тестах
        run: |
          FOUND=$(grep -rn 'properties = "app\.[a-z-]*test' src/test/java || true)
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "Маркерное свойство поднимает лишний контекст Spring с ещё одним пулом."
            echo "Нужен свой контекст — дайте настоящую настройку или @Import с подменой бина."
            exit 1
          fi

      # Тесты поднимают настоящий Postgres через Testcontainers: на mock-объектах
      # ни изоляция арендаторов, ни триггеры остатка не проверяются вовсе.
      # Docker на ubuntu-раннере есть из коробки; версию API не навязываем —
      # PostgresTestBase берёт умолчание, если переменная не задана.
      - name: Тесты
        run: ./mvnw -B -ntp test

      # Отчёты нужны, когда падение не воспроизводится локально: в логе job
      # видно только имя теста, а причина — в surefire-отчёте.
      - name: Отчёты упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия берётся из .nvmrc, чтобы не разъезжаться с локальной.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, а не install: install молча правит package-lock.json, и сборка
      # начинает зависеть от того, когда её запустили.
      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test -- --run

      # build включает tsc --noEmit: строгий режим TypeScript ловит то, что
      # тесты не ловят, — и падать это должно здесь, а не при выкладке.
      - name: Сборка
        run: npm run build

  deployment:
    name: Развёртывание
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Копии прогона: у каждой обязан быть тот, кто её снимет. 18 сентября
      # 2026 волна встала целиком — «Artifact storage quota has been hit»
      # на всех трёх PR разом, 176 просроченных копий на 23,9 ГБ. Ловушка
      # в том, что истёкший срок хранения места НЕ освобождает: копия
      # помечается просроченной, скачать её нельзя, а квоту она держит.
      # Падает при этом шаг, к коду отношения не имеющий, и повторный прогон
      # не помогает вовсе — красный без дефекта приучает не верить проверкам.
      #
      # Сторож стоит в этой задаче, а не в отдельной: копию выгружает она же,
      # проверка занимает секунды, и новая задача CI потребовала бы правки
      # поимённого списка `needs` у публикации — того самого файла, который
      # дерётся смыслом, а не текстом. Самопроверка идёт первой: сторож,
      # не краснеющий на дефекте, хуже отсутствующего.
      - name: tools/ci-artifacts-guard.py --selftest
        run: ./tools/ci-artifacts-guard.py --selftest

      - name: tools/ci-artifacts-guard.py
        run: ./tools/ci-artifacts-guard.py

      # Конфигурация терминатора не проверяется ничем остальным: ошибка в ней
      # обнаруживается на выкладке, то есть в момент, когда клиенты уже ждут.
      # Секунды на проверку против часа разбора в бою.
      #
      # Файл активной сборки монтируется рядом: Caddyfile его импортирует,
      # и без него разбор падает. Проверяется он тут не «заодно» — это
      # единственное место, где записано, куда идёт трафик ячейки.
      - name: Конфигурация терминатора
        run: |
          docker run --rm -v "$PWD/ops/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/ops/active-build.caddy:/etc/caddy/active-build.caddy:ro" \
            -e APP_DOMAIN=parts.example.ru \
            -e S3_DOMAIN=s3.example.ru \
            -e ACME_EMAIL=ci@example.ru \
            -e PROVISIONING_ALLOW=10.0.0.0/8 \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      # Переключатель трафика проверяет себя сам: без docker и без ячейки,
      # на разборе файла активной сборки и записи в него. Он единственное,
      # что стоит между «новая сборка не поднялась» и «люди уехали на неё»,
      # а проверка, которая не краснеет на дефекте, хуже отсутствующей.
      - name: ops/switch-build.sh --selftest
        run: ./ops/switch-build.sh --selftest

      # Кнопка раскатки (задача 0075) — три инструмента, и каждый проверяет
      # себя без стенда и без docker. Это единственное, чем их вообще можно
      # проверить в прогоне: машин под ИФТ и ПСИ ещё нет, а выкладка,
      # ломающаяся на стенде, ломается в ту минуту, когда её ждут.
      #
      #   deploy-plan  — «мигрируем старшим образом, разворачиваем младший»:
      #                  правило, из-за которого откат вниз вообще возможен;
      #   deploy-checks — пять самопроверок, каждая краснеет на своём
      #                  дефекте и называет себя по имени;
      #   smoke-run    — дымовой прогон сценарием: он краснеет на шаге,
      #                  который ответил успехом и не сделал дела, и НЕ ПИШЕТ
      #                  на ПРОМ — последнее проверяется перебором запросов;
      #   deploy       — ПОРЯДОК шагов: старая сборка гаснет последней.
      - name: Инструменты выкладки проверяют себя
        run: |
          ./tools/deploy-plan.py --selftest
          ./ops/deploy-checks.sh --selftest
          ./ops/smoke-run.sh --selftest
          ./ops/deploy.sh --selftest

      # Форма кнопки разбирается и несёт ровно те четыре поля, которые
      # назвал владелец. Сломанный workflow GitHub не выполняет МОЛЧА —
      # он просто не появляется в списке, — а переименованное поле рвёт
      # связь с ops/deploy.sh, где значения разбираются словами.
      - name: Форма кнопки раскатки
        run: |
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('.github/workflows/deploy.yml'))
          inputs = d[True]['workflow_dispatch']['inputs']
          want = {'stand': ['ift', 'psi', 'prom'],
                  'migrations': ['накатить', 'не трогать', 'только миграции'],
                  'data': ['не трогать', 'обезличенный слепок прома', 'эталонный набор']}
          for name, options in want.items():
              got = inputs[name]['options']
              if got != options:
                  sys.exit(f'поле «{name}» формы: ожидалось {options}, стоит {got}')
          if 'ref' not in inputs:
              sys.exit('в форме нет поля «ref» — выбирать ветку нечем')
          if set(d['jobs']) != {'plan', 'deploy'}:
              sys.exit(f'задачи кнопки: {list(d["jobs"])}')
          print('Форма кнопки на месте:', ', '.join(inputs))
          PY

      # Проверяется не только синтаксис compose, но и полнота .env.example:
      # переменные заполняются заглушками прямо из него, и забытая в примере
      # обязательная переменная валит эту команду. Иначе о ней узнаёт клиент,
      # разворачивающий ячейку по инструкции.
      #
      # Обе сборки называются явно: `config` показывает только сервисы
      # включённых профилей, а сборки стоят под профилями blue и green —
      # без этих флагов зелёная не проверялась бы вовсе.
      - name: Боевой compose и полнота .env.example
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f docker-compose.prod.yml --env-file .env \
            --profile blue --profile green config >/dev/null

      # Какие сборки поднимутся у клиента — вопрос к самому compose, а не
      # к глазам: обе стоят под профилями, и ячейка, обновлённая по инструкции,
      # написанной до 0079, не поднимала НИ ОДНОЙ — в её .env нет строки
      # COMPOSE_PROFILES (задача 0110). У правки два края, и сторож проверяет
      # оба: без строки поднимается прежняя сборка, а названный профиль
      # погашенную не воскрешает. Себя он перед этим проверяет на двух
      # подделках — «как было» и «сняли профиль вовсе».
      - name: Какие сборки поднимет ячейка
        run: |
          ./ops/builds-guard.sh --selftest
          ./ops/builds-guard.sh

      # Пропавший файл настройки docker подменяет пустым КАТАЛОГОМ и молча
      # подключает его в контейнер (задача 0101). Четыре из семи таких файлов —
      # сам механизм тревог: ячейка, у которой их отняли, о себе не сообщит
      # ничем, потому что сообщать нечем. Поэтому состав проверяется до
      # подъёма — шагом выкладки и здесь. Себя сторож проверяет на трёх
      # подделках, включая ту, что оставляет за собой docker; настоящее
      # дерево при этом обязано проходить.
      - name: Настройки ячейки — файл, а не каталог
        run: ./ops/config-guard.sh --selftest

      # Сторож канала тревог (задача 0153). Девять случаев на подложенных
      # счётчиках диспетчера: молчит на исторических отказах и на перезапуске,
      # краснеет на растущих, будит не чаще выдержки, и отдельным кодом
      # отвечает «сказать не удалось» — «сообщили» и «не смогли сообщить»
      # выдавать одно за другое нельзя, иначе он повторит ту самую поломку,
      # ради которой написан. Ни ячейки, ни docker, ни сети не нужно.
      - name: Сторож канала тревог
        run: ./ops/alert-channel-check.sh --selftest
      # Расписание, поставленное в crontab и не запускающееся ни разу
      # (задача 0152). Задачи кончаются перенаправлением в файл, а файл
      # перенаправления создаёт шелл — ДО запуска команды: нет прав, и команда
      # не стартует вовсе, молча и все пять сразу. Боевая ячейка прожила так
      # с самого заведения расписания: без логических дампов, без офсайт-копии
      # и без репетиции возврата. Сторож пробует путь тем же действием, что
      # и cron, и при отказе не трогает crontab; самопроверка это и стережёт —
      # включая возврат дефекта: копия скрипта со снятой проверкой обязана
      # поставить мёртвое расписание молча. Настоящий crontab не трогается.
      - name: Расписание ячейки запустится, а не только встанет
        run: ./ops/install-cron.sh --selftest

      # Прокрутка журнала расписания (задача 0154). В журнал пишут все пять
      # задач, а задача архива идёт каждые пять минут — 288 запусков в сутки:
      # без прокрутки файл растёт до конца диска, а заполненный диск ячейки
      # останавливает Postgres и вместе с ним архив WAL, то есть точку
      # возврата. Семь случаев, и два из них — возврат дефекта: копия скрипта
      # со снятой прокруткой обязана дать журналу расти дальше, а расписание
      # без её строки обязано краснеть на `--show`. Главный случай — идущая
      # задача: она держит дескриптор `>> ЖУРНАЛ`, и её вывод не имеет права
      # пропасть (этим переименование и отличается от copytruncate).
      # Ни ячейки, ни docker, ни сети не нужно.
      - name: Журнал расписания не растёт без предела
        run: ./ops/rotate-log.sh --selftest

      # Проверка бэкапа, называвшая причину, которой не проверяла (задача 0157).
      # Отказ разворота глушился (`>/dev/null 2>&1 || true`), и еженедельная
      # проверка жаловалась на СЛЕДСТВИЕ — «relation t_000042.part does not
      # exist», — потому что таблиц не было вовсе: в голой базе нет расширений,
      # а в дампах схем их нет по построению. Здесь проверяется сам разбор
      # вывода pg_restore на подложенных выводах: отказ по расширениям обязан
      # называть расширения, безобидное «schema public already exists» —
      # проходить, незнакомая беда — доезжать дословно и без выдуманной
      # причины. Плюс возврат дефекта: копия с заглушённым вердиктом обязана
      # валить самопроверку. Ни ячейки, ни docker, ни набора не нужно.
      - name: Проверка бэкапа называет причину, а не следствие
        run: ./ops/verify-backup.sh --selftest

      # Заведение доступа кнопки к стенду (задача 0140). Проверяются ОТКАЗЫ:
      # чужой отпечаток хоста, значение секрета аргументом, перевыпуск поверх
      # живого ключа. Ни стенда, ни сети, ни gh для этого не нужно — keyscan
      # и gh подменяются. Скрипт, не отказывающий на подделке, выдал бы
      # настроенный доступ там, где доступа нет.
      - name: Доступ кнопки к стендам
        run: ./ops/deploy-access.sh --selftest

      # Образ собирается тем же многоступенчатым Dockerfile, что и в бою:
      # фронтенд внутрь jar, jar в JRE. Бэкенд и фронтенд проверены соседними
      # задачами по отдельности, а здесь ловится их сборка вместе — то, что
      # ломается при выкладке и больше нигде.
      #
      # И собирается ровно один раз за прогон: дальше этот же файл уезжает
      # в реестр задачей «Публикация образа». Пересборка там дала бы второй
      # артефакт из того же Dockerfile — другая сеть, другой кэш npm, —
      # то есть ровно ту разницу, ради устранения которой всё и делалось.
      - name: Сборка боевого образа
        run: docker build -t partsflow:ci .

      # Образ уезжает следующей задаче файлом, а не пересборкой: только так
      # «прошло проверки» и «уехало клиенту» означают один и тот же файл.
      # Живёт он сутки — дольше незачем, опубликованное лежит в реестре, —
      # а снимает его задача «Уборка копии образа» в том же прогоне.
      #
      # Только на push, и это ровно то же условие, что у публикации: файл
      # забирает она одна, а на pull_request её нет вовсе (github.sha там —
      # эфемерный коммит слияния, образ с таким именем ничей). То есть копия,
      # заведённая на PR, не нужна НИКОМУ и ни минуты — а держала квоту
      # наравне с остальными, и это половина всего мусора: пуш в ветку
      # с открытым PR заводит два прогона, копию оставлял каждый.
      # Сборка образа при этом на PR идёт как раньше: проверяется сборка,
      # а не сохранение файла.
      - name: Образ файлом
        if: github.event_name == 'push'
        run: docker save partsflow:ci -o /tmp/partsflow-image.tar

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: app-image
          path: /tmp/partsflow-image.tar
          retention-days: 1

  publish:
    name: Публикация образа
    # Ждёт ВСЕХ проверок, а не только сборки. Образ в реестре — это уже
    # не черновик: по тегу за ним придут на выкладке, а неверным его делает
    # любая красная задача, не одна лишь «Развёртывание».
    needs:
      - changelog
      - migration-compat
      - endpoints
      - test-schemas
      - worktrees
      - recovery-point
      - migrations
      # Задачу сюда дописывают вместе с самой задачей: список поимённый,
      # и забытое имя не ломает ни одного прогона — просто красная проверка
      # перестаёт останавливать публикацию. Поймано разбором PR #197:
      # «Откат по шагам» появилась в другой ветке, конфликта при слиянии
      # не возникло, и образ уехал бы в реестр при красном откате.
      - rollback
      # Зеркало образов: без него не начинается «Бэкенд», и список здесь
      # поимённый — забытое имя не ломает ни одного прогона, просто красная
      # проверка перестаёт останавливать публикацию (так было с «Откатом
      # по шагам», PR #197).
      - mirror
      - backend
      - frontend
      - deployment
    # Только push. У события pull_request github.sha — это эфемерный коммит
    # слияния, которого нет в истории ни одной ветки: образ, названный таким
    # SHA, ничей, и вернуться к нему по номеру коммита нельзя.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Право писать в GHCR даётся здесь и только здесь: остальным задачам
      # оно не нужно, а токен с лишними правами живёт во всех них сразу.
      packages: write
    steps:
      - name: Имя образа
        id: image
        # GHCR принимает только строчные буквы, а владелец репозитория
        # написан как написан. Тег — SHA коммита: не latest и не имя ветки,
        # иначе «в бою работает такой-то коммит» перестаёт быть фактом.
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/$REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Вход в реестр
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Этот SHA уже опубликован?
        id: published
        # Повторный прогон того же коммита не обязан класть в реестр второй
        # образ. Сборка не побайтово повторяема (время в jar), поэтому тот же
        # тег получил бы новый digest, а прежний — тот, что уже стоит
        # на стенде, — остался бы висеть без имени. Тег по SHA неизменен
        # по смыслу: опубликованный не трогаем и говорим об этом вслух.
        run: |
          if docker manifest inspect '${{ steps.image.outputs.ref }}' >/dev/null 2>&1; then
            echo "Уже в реестре: ${{ steps.image.outputs.ref }} — публикация пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.published.outputs.skip == 'false'
        with:
          name: app-image
          path: /tmp

      - name: Публикация
        if: steps.published.outputs.skip == 'false'
        run: |
          docker load -i /tmp/partsflow-image.tar
          docker tag partsflow:ci '${{ steps.image.outputs.ref }}'
          docker push '${{ steps.image.outputs.ref }}'

      - name: Чем выкладывать
        # Последняя строка вывода — то, что оператор переносит в .env ячейки.
        # Без неё SHA пришлось бы выковыривать из адресной строки браузера.
        run: |
          echo "Образ: ${{ steps.image.outputs.ref }}"
          echo "Digest: $(docker manifest inspect -v '${{ steps.image.outputs.ref }}' \
            | jq -r 'if type == "array" then .[0] else . end | .Descriptor.digest')"
          echo "Выкладка ячейки: APP_IMAGE_TAG=${{ github.sha }}"

  image-cleanup:
    name: Уборка копии образа
    # Ждёт сборку и публикацию, но идёт при ЛЮБОМ их исходе. Публикация файл
    # уже забрала — больше он не нужен ни для чего; а красный прогон оставлял
    # копию ровно так же, как зелёный: она выгружена ДО того, как покраснела
    # соседняя проверка, и публикация в этом случае просто не запускается.
    #
    # В `needs` у публикации этой задачи нет и быть не должно: она идёт ПОСЛЕ
    # неё и проверкой не является. Список `needs` публикации поимённый —
    # дописывают туда проверки, а не уборку.
    needs: [deployment, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Единственное право задачи — удалять копии прогонов, и это единственное
      # место, где оно есть: токен с лишними правами живёт во всех задачах
      # сразу. Репозиторий ей не нужен вовсе — она его не выкачивает.
      actions: write
    steps:
      - name: Снять копию этого прогона и выгрести просроченные
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT: app-image
        run: |
          set -euo pipefail

          # 1. Своя копия. Мусор лучше не выгребать, а не создавать: удаление
          #    через API не зависит ни от срока хранения, ни от уборки
          #    по расписанию — планировщика в проекте нет по решению владельца.
          #    Отказ здесь валит задачу намеренно: молча переставшая работать
          #    уборка — это ровно то, с чего всё началось.
          MINE=$(gh api "/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT\") | .id")
          for id in $MINE; do
            gh api -X DELETE "/repos/$REPO/actions/artifacts/$id"
            echo "снята копия $ARTIFACT ($id)"
          done
          [ -n "$MINE" ] || echo "копии $ARTIFACT в этом прогоне нет — нечего снимать"

          # 2. Просроченные — чьи угодно. Истёкший срок места НЕ освобождает,
          #    а своей уборки не дожидаются два случая: прогон, отменённый
          #    новым пушем (concurrency cancel-in-progress), и отчёты упавших
          #    тестов — те живут 7 дней намеренно, их снимать в прогоне нельзя.
          #    Трогаем только заведомо мёртвое: просроченную копию нельзя
          #    скачать, то есть годную копию чужого идущего прогона так
          #    не заденешь. Отказ тут не валит задачу: чужую копию может
          #    удалить кто-то ещё между списком и удалением.
          DEAD=$(gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired) | .id')
          SWEPT=0
          for id in $DEAD; do
            if gh api -X DELETE "/repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              SWEPT=$((SWEPT + 1))
            fi
          done
          echo "выгребено просроченных копий: $SWEPT"
